<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon cahier de français</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Source Serif 4', Georgia, serif;
    color: #1c2a4a;
    background-color: #fdfcf7;
    background-image:
      linear-gradient(90deg, transparent 0, transparent 44px, #e8637c 44px, #e8637c 45.5px, transparent 45.5px),
      repeating-linear-gradient(#fdfcf7 0, #fdfcf7 30px, #c3d6ee 30px, #c3d6ee 31px);
    display: flex;
    justify-content: center;
    padding: 24px 12px 48px;
  }
  .page { width: 100%; max-width: 480px; }

  .title {
    font-family: 'Caveat', cursive;
    font-size: 2.6rem;
    font-weight: 700;
    color: #17356e;
    margin: 0;
    line-height: 1.1;
  }
  .subtitle { color: #5a6b8c; margin: 2px 0 26px; font-size: 0.95rem; }

  .card {
    background: #ffffff;
    border: 1px solid #d8dce6;
    border-radius: 10px;
    box-shadow: 0 2px 10px rgba(23, 53, 110, 0.07);
    padding: 20px;
    margin-bottom: 16px;
  }

  .modeBtn {
    display: block; width: 100%;
    text-align: left;
    background: #ffffff;
    border: 1.5px solid #b9c6de;
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 12px;
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 600;
    color: #17356e;
    cursor: pointer;
    transition: border-color .12s, transform .12s;
  }
  .modeBtn:hover { border-color: #17356e; }
  .modeBtn:active { transform: scale(0.985); }
  .modeBtn small { display: block; font-weight: 400; color: #5a6b8c; margin-top: 3px; }

  .chipRow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .chip {
    border-radius: 999px;
    border: 1.5px solid #b9c6de;
    background: #fff;
    color: #5a6b8c;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .chip.on { background: #17356e; border-color: #17356e; color: #fff; }
  .label { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.08em; color: #5a6b8c; }
  .labelRow { display: flex; justify-content: space-between; align-items: baseline; }

  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .back {
    background: none; border: none; font-family: inherit;
    color: #17356e; font-size: 0.95rem; cursor: pointer; padding: 6px 0;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .scorebox { font-size: 0.9rem; color: #5a6b8c; text-align: right; }
  .scorebox b { color: #17356e; }
  .streak { color: #b8302f; font-weight: 700; }

  .qPrompt { color: #5a6b8c; font-size: 0.95rem; margin: 0; }
  .qBig {
    font-size: 1.9rem; font-weight: 700; color: #17356e;
    margin: 6px 0 2px; line-height: 1.25;
  }
  .qBig.sentence { font-size: 1.3rem; font-weight: 600; }
  .qSub { color: #8391ad; font-size: 0.88rem; margin: 0 0 6px; }

  .opt {
    display: block; width: 100%;
    background: #fff;
    border: 1.5px solid #b9c6de;
    border-radius: 10px;
    padding: 15px 16px;
    margin-top: 10px;
    font-family: inherit;
    font-size: 1.1rem;
    color: #1c2a4a;
    text-align: left;
    cursor: pointer;
    transition: border-color .12s, background .12s;
  }
  .opt:not(:disabled):hover { border-color: #17356e; }
  .opt:disabled { cursor: default; }
  .opt.good { border-color: #2e7d4f; background: #eef7f0; font-weight: 700; }
  .opt.bad { border-color: #b8302f; background: #fbeeee; text-decoration: line-through; }
  .opt.dim { opacity: 0.5; }

  .typeRow { display: flex; gap: 8px; margin-top: 14px; align-items: center; }
  .typePrefix { font-size: 1.1rem; color: #17356e; font-weight: 600; white-space: nowrap; }
  .typeInput {
    flex: 1; min-width: 0;
    font-family: inherit; font-size: 1.1rem;
    padding: 12px 14px;
    border: 1.5px solid #b9c6de; border-radius: 10px;
    color: #1c2a4a; background: #fff;
  }
  .typeInput:focus { outline: none; border-color: #17356e; }
  .typeOk {
    background: #17356e; color: #fff; border: none; border-radius: 10px;
    padding: 12px 18px; font-family: inherit; font-size: 1rem; font-weight: 600;
    cursor: pointer;
  }
  .typedAnswer { margin-top: 12px; font-size: 1.1rem; }
  .typedAnswer .wrong { color: #b8302f; text-decoration: line-through; }
  .accentNote {
    font-family: 'Caveat', cursive; font-size: 1.3rem;
    color: #c07d1a; margin: 4px 0 0;
  }

  .speakBtn {
    background: #fff; border: 1.5px solid #b9c6de; border-radius: 10px;
    font-size: 1.6rem; padding: 10px 22px; cursor: pointer; margin-top: 6px;
  }
  .speakBtn:hover { border-color: #17356e; }

  .stamp {
    font-family: 'Caveat', cursive;
    font-size: 1.9rem;
    font-weight: 700;
    transform: rotate(-3deg);
    display: inline-block;
    margin-top: 14px;
  }
  .stamp.ok { color: #2e7d4f; }
  .stamp.ko { color: #b8302f; }
  .correction {
    font-family: 'Caveat', cursive;
    font-size: 1.5rem;
    color: #b8302f;
    margin: 2px 0 0;
  }
  .why { color: #5a6b8c; font-size: 0.92rem; margin: 8px 0 0; font-style: italic; }

  .textCard { max-height: 280px; overflow-y: auto; padding: 16px 18px; }
  .readText {
    font-size: 0.97rem; line-height: 1.6; color: #1c2a4a;
    margin: 10px 0 0; text-align: justify; hyphens: auto;
  }

  .nextBtn {
    width: 100%;
    margin-top: 16px;
    background: #17356e;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 15px;
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
  }
  .nextBtn:active { transform: scale(0.985); }

  .histHead { display: flex; justify-content: space-between; align-items: baseline; }
  .histClear {
    background: none; border: none; font-family: inherit;
    color: #8391ad; font-size: 0.8rem; cursor: pointer;
    text-decoration: underline; text-underline-offset: 2px;
  }
  .histRow {
    display: flex; justify-content: space-between; gap: 8px;
    padding: 8px 0; border-bottom: 1px dashed #e2e7f0;
    font-size: 0.88rem;
  }
  .histRow:last-child { border-bottom: none; }
  .histDate { color: #8391ad; white-space: nowrap; }
  .histMode { color: #5a6b8c; flex: 1; text-align: left; }
  .histScore { font-weight: 600; color: #17356e; white-space: nowrap; }
  .histScore.hi { color: #2e7d4f; }
  .histScore.lo { color: #b8302f; }

  .statRow {
    display: flex; justify-content: space-between; gap: 8px;
    padding: 7px 0; border-bottom: 1px dashed #e2e7f0; font-size: 0.92rem;
  }
  .statRow:last-child { border-bottom: none; }
  .statName { color: #1c2a4a; }
  .statVal { font-weight: 600; white-space: nowrap; }
  .statVal.hi { color: #2e7d4f; }
  .statVal.lo { color: #b8302f; }
  .statEmpty { color: #8391ad; font-size: 0.92rem; margin: 8px 0 0; }
  .statNote { color: #8391ad; font-size: 0.85rem; margin-top: 12px; }
  .helpCard p { font-size: 0.94rem; line-height: 1.55; margin: 10px 0 0; }
  .helpCard p:first-of-type { margin-top: 12px; }
  .voiceDiag { font-size: 0.82rem; color: #8391ad; margin: 10px 0 0; }
  .voiceDiag.warn { color: #b8302f; }
  .secLabel { display: block; margin: 20px 0 10px; }
  .streakCard { padding: 14px 18px; }
  .streakLine { font-size: 0.95rem; color: #5a6b8c; }
  .streakLine b { color: #17356e; }
  .hm { display: flex; gap: 3px; margin-top: 10px; }
  .hmd { width: 11px; height: 11px; border-radius: 3px; background: #e8ecf3; flex: 1; max-width: 13px; }
  .hmd.p { background: #a5c4e8; }
  .hmd.g { background: #2e7d4f; }
  .dictDiff { line-height: 1.7; }
  .dw.good { color: #2e7d4f; font-weight: 600; }
  .dw.acc { color: #c07d1a; font-weight: 600; }
  .dw.bad { color: #b8302f; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
  .dictYours { color: #8391ad; font-size: 0.9rem; margin-top: 6px; }
  .knowBtn {
    background: #fff; border: 1.5px solid #b9c6de; border-radius: 999px;
    color: #2e7d4f; font-family: inherit; font-size: 0.78rem;
    padding: 3px 10px; margin-left: 8px; cursor: pointer; vertical-align: middle;
  }
  .knowBtn:hover { border-color: #2e7d4f; }

  .doneCard { text-align: center; padding: 32px 20px; }
  .doneStamp {
    font-family: 'Caveat', cursive;
    font-size: 2.8rem; font-weight: 700;
    color: #b8302f; transform: rotate(-3deg);
  }
  .doneScore { font-size: 2.4rem; font-weight: 700; color: #17356e; margin-top: 10px; }
  .donePct { color: #5a6b8c; margin-top: 2px; }
  .doneMeta { color: #8391ad; font-size: 0.88rem; margin: 6px 0 20px; }
  .doneMenuBtn { text-align: center; margin-top: 10px; margin-bottom: 0; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="page" id="app"></div>

<script src="data.js"></script>
<script>
"use strict";

const APP_VERSION = "12 (2026-08-25)";

// ── Skládání tvarů ──────────────────────────────────────────
const PRONOUNS = ["je", "tu", "il", "nous", "vous", "ils"];
const AVOIR = ["ai", "as", "a", "avons", "avez", "ont"];
const ETRE = ["suis", "es", "est", "sommes", "êtes", "sont"];
const ALLER = ["vais", "vas", "va", "allons", "allez", "vont"];
const IMP_END = ["ais", "ais", "ait", "ions", "iez", "aient"];
const FS_END = ["ai", "as", "a", "ons", "ez", "ont"];
const TENSES = [
  { id: "present", label: "Présent", lvl: "A1" },
  { id: "futur", label: "Futur proche", lvl: "A1" },
  { id: "pc", label: "Passé composé", lvl: "A2" },
  { id: "imp", label: "Imparfait", lvl: "A2" },
  { id: "fs", label: "Futur simple", lvl: "B1" },
  { id: "cond", label: "Conditionnel", lvl: "B1" },
  { id: "subj", label: "Subjonctif", lvl: "B2" },
];
const LVL = { A1: 1, A2: 2, B1: 3, B2: 4 };
const LEVELS = ["A1", "A2", "B1", "B2"];
const lvlOk = (itemLvl, def) => LVL[itemLvl || def] <= LVL[state.level];
const tensePreset = (level) => TENSES.filter((t) => LVL[t.lvl] <= LVL[level]).map((t) => t.id);
const TENSE_LABEL = Object.fromEntries(TENSES.map((t) => [t.id, t.label]));

const startsVowel = (w) => /^[aeiouhâêéèàû]/i.test(w);
const joinPronoun = (i, rest) =>
  i === 0 && startsVowel(rest) ? "j'" + rest : PRONOUNS[i] + " " + rest;

// kmen imparfait/subjonctivu (nous-tvar bez -ons), s pravopisnou
// úpravou před koncovkami na -i (mangions, commencions)
const nousStem = (verb) => (verb.inf === "être" ? "ét" : verb.present[3].replace(/ons$/, ""));
const iAdjust = (stem) =>
  stem.endsWith("ge") ? stem.slice(0, -1) : stem.endsWith("ç") ? stem.slice(0, -1) + "c" : stem;
const futStem = (verb) =>
  FUT_STEMS[verb.inf] || (verb.inf.endsWith("re") ? verb.inf.slice(0, -1) : verb.inf);

// tvar bez zájmena
function conjBare(verb, tenseId, i) {
  if (tenseId === "present") return verb.present[i];
  if (tenseId === "futur") return ALLER[i] + " " + verb.inf;
  if (tenseId === "pc") {
    if (verb.aux === "etre") return ETRE[i] + " " + verb.pp + (i >= 3 ? "s" : "");
    return AVOIR[i] + " " + verb.pp;
  }
  if (tenseId === "imp") {
    const e = IMP_END[i];
    const st = e.startsWith("i") ? iAdjust(nousStem(verb)) : nousStem(verb);
    return st + e;
  }
  if (tenseId === "fs") return futStem(verb) + FS_END[i];
  if (tenseId === "cond") return futStem(verb) + IMP_END[i];
  // subjonctif
  if (SUBJ_FORMS[verb.inf]) return SUBJ_FORMS[verb.inf][i];
  const s1 = verb.present[5].replace(/ent$/, "");
  if (i === 3 || i === 4) return iAdjust(nousStem(verb)) + (i === 3 ? "ions" : "iez");
  return s1 + ["e", "es", "e", , , "ent"][i];
}

// tvar se zájmenem (subjonctif s "que")
function conjDisplay(verb, tenseId, i) {
  const base = joinPronoun(i, conjBare(verb, tenseId, i));
  if (tenseId !== "subj") return base;
  return (base.startsWith("il") ? "qu'" : "que ") + base;
}

// prefix pro psací režim (zájmeno, u subj s "que")
function typePrefix(tenseId, i) {
  const p = PRONOUNS[i];
  if (tenseId !== "subj") return p;
  return (p === "il" || p === "ils" ? "qu'" : "que ") + p;
}

// ── Čísla 0–100 ─────────────────────────────────────────────
const NUM_UNITS = ["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix",
  "onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
const NUM_TENS = { 20: "vingt", 30: "trente", 40: "quarante", 50: "cinquante", 60: "soixante" };
function frNumber(n) {
  if (n === 100) return "cent";
  if (n < 20) return NUM_UNITS[n];
  if (n >= 80) {
    if (n === 80) return "quatre-vingts";
    return "quatre-vingt-" + NUM_UNITS[n - 80];
  }
  if (n >= 70) {
    if (n === 71) return "soixante et onze";
    return "soixante-" + NUM_UNITS[n - 60];
  }
  const t = Math.floor(n / 10) * 10, u = n % 10;
  if (u === 0) return NUM_TENS[t];
  if (u === 1) return NUM_TENS[t] + " et un";
  return NUM_TENS[t] + "-" + NUM_UNITS[u];
}

// ── Pomocné ─────────────────────────────────────────────────
const rnd = (n) => Math.floor(Math.random() * n);
const pick = (arr) => arr[rnd(arr.length)];
const shuffle = (arr) => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = rnd(i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

const PRAISE = ["Très bien !", "Parfait !", "Bravo !", "Excellent !", "Super !"];
const OOPS = ["Oh non…", "Presque !", "Pas tout à fait…", "Hmm…"];
const MODE_LABEL = {
  mix: "Mix", conj: "Časování", frcz: "FR → ČJ", czfr: "ČJ → FR",
  sent: "PC × Imparfait", num: "Čísla", gen: "Rody", cete: "Čtení",
  gram: "Gramatika", dict: "Diktát", due: "Opakování", errs: "Moje chyby",
};
const GRP_LABEL = { all: "všechna", irr: "nepravidelná", reg: "pravidelná" };
const LENGTHS = [
  { id: 10, label: "10" }, { id: 25, label: "25" },
  { id: 50, label: "50" }, { id: 0, label: "∞" },
];
const fmtDate = (ts) =>
  new Date(ts).toLocaleString("cs-CZ", {
    day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit",
  });

// normalizace psaných odpovědí
const normBase = (s) =>
  String(s).toLowerCase().trim()
    .replace(/[’']/g, "")
    .replace(/quatre[-\s]vingts/g, "quatre-vingt")
    .replace(/[-\s]+/g, " ");
const stripAcc = (s) => normBase(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "");
// vrací: 2 = přesně, 1 = správně až po odstranění diakritiky, 0 = špatně
function matchTyped(input, accepted) {
  for (const a of accepted) if (normBase(input) === normBase(a)) return 2;
  for (const a of accepted) if (stripAcc(input) === stripAcc(a)) return 1;
  return 0;
}

// ── Zvuk (Web Speech API) ───────────────────────────────────
const TTS_OK = "speechSynthesis" in window;
// u.lang samo o sobě řada prohlížečů ignoruje a čte výchozím
// (anglickým) hlasem — je nutné explicitně vybrat francouzský
// hlas z getVoices(). Seznam se navíc načítá asynchronně.
let frVoice = null;
function pickFrVoice() {
  if (!TTS_OK) return;
  const vs = speechSynthesis.getVoices();
  frVoice =
    vs.find((v) => /^fr[-_]FR/i.test(v.lang)) ||
    vs.find((v) => /^fr/i.test(v.lang)) ||
    vs.find((v) => /fran(ç|c)ais|french/i.test(v.name)) ||
    null;
}
// diagnostika pro menu: jaký hlas se reálně použije
function voiceDiag() {
  if (!TTS_OK) return null;
  pickFrVoice();
  if (frVoice) return { ok: true, msg: "Hlas: " + frVoice.name + " (" + frVoice.lang + ")" };
  const n = speechSynthesis.getVoices().length;
  if (n === 0) return { ok: false, msg: "Hlasy se ještě načítají — zkus přehrát první otázku a vrať se sem." };
  return { ok: false, msg: "Francouzský hlas v zařízení nenalezen (" + n + " hlasů, žádný fr) — předčítání bude anglicky. Návod na instalaci je v Nápovědě." };
}
if (TTS_OK) {
  pickFrVoice();
  speechSynthesis.onvoiceschanged = () => {
    pickFrVoice();
    if (state.screen === "menu") render(); // ať se diagnostika obnoví
  };
}
function speak(text) {
  if (!TTS_OK) return;
  try {
    if (!frVoice) pickFrVoice(); // hlasy se mohly načíst později
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (frVoice) u.voice = frVoice;
    u.lang = frVoice ? frVoice.lang : "fr-FR";
    u.rate = 0.85;
    speechSynthesis.speak(u);
  } catch {}
}

// ── Úložiště ────────────────────────────────────────────────
const HIST_KEY = "fr-cahier-history";
const STATS_KEY = "fr-cahier-stats";
const SETTINGS_KEY = "fr-cahier-settings";
const DAYS_KEY = "fr-cahier-days";
function loadJSON(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch { return fallback; }
}
function saveJSON(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

// statistiky + Leitner SRS:
// { "<id>": { o, b, box: 1–5, due: timestamp } }
// správně → krabička +1 (max 5), chyba → krabička 1;
// intervaly krabiček: 1 / 3 / 7 / 14 / 30 dní
const BOX_DAYS = [0, 1, 3, 7, 14, 30];
function recStat(id, ok) {
  if (!id) return;
  const st = state.stats;
  if (!st[id]) st[id] = { o: 0, b: 0 };
  if (ok) st[id].o++; else st[id].b++;
  const box = ok ? Math.min((st[id].box || 0) + 1, 5) : 1;
  st[id].box = box;
  st[id].due = Date.now() + BOX_DAYS[box] * 864e5;
  saveJSON(STATS_KEY, st);
  // denní počítadlo (streak)
  const k = todayKey();
  state.days[k] = (state.days[k] || 0) + 1;
  for (const dk of Object.keys(state.days)) {
    if (Date.now() - new Date(dk).getTime() > 120 * 864e5) delete state.days[dk];
  }
  saveJSON(DAYS_KEY, state.days);
}
const pad2 = (n) => String(n).padStart(2, "0");
function todayKey(offsetDays) {
  const d = new Date(Date.now() - (offsetDays || 0) * 864e5);
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}
function streakInfo() {
  const today = state.days[todayKey()] || 0;
  let streak = 0;
  let i = today >= state.goal ? 0 : 1; // dnešek se počítá, až když je cíl splněný
  while ((state.days[todayKey(i)] || 0) >= state.goal) { streak++; i++; }
  return { today, streak };
}
// položky k opakování / chybové (čtení t| se do front nehodí — je to celá session)
const dueIds = () =>
  Object.entries(state.stats)
    .filter(([id, s]) => s.due && s.due <= Date.now() && !id.startsWith("t|"))
    .map(([id]) => id);
const errIds = () =>
  Object.entries(state.stats)
    .filter(([id, s]) => s.b > 0 && !id.startsWith("t|"))
    .sort((a, b) => b[1].b / (b[1].o + b[1].b) - a[1].b / (a[1].o + a[1].b))
    .slice(0, 20)
    .map(([id]) => id);
const errWeight = (id) => {
  const s = state.stats[id];
  if (!s) return 1.3; // mírná preference dosud neviděných
  const n = s.o + s.b;
  return 1 + 6 * (s.b / n) * Math.min(1, n / 3);
};
function sampleWeighted(cands, idFn) {
  const ws = cands.map((c) => errWeight(idFn(c)));
  let sum = ws.reduce((a, b) => a + b, 0);
  let r = Math.random() * sum;
  for (let i = 0; i < cands.length; i++) {
    r -= ws[i];
    if (r <= 0) return cands[i];
  }
  return cands[cands.length - 1];
}

// ── Stav ────────────────────────────────────────────────────
const DEFAULT_SETTINGS = {
  level: "B1", // A1 | A2 | B1 | B2 — řídí obsah celé appky
  tenseIds: ["present", "pc", "futur"],
  grp: "all",
  sessionLen: 10,
  ans: "choice", // choice | text
  smart: true,
  sound: false,
  goal: 20, // denní cíl (počet otázek)
  vocabSrc: "all", // all | verbs | themes
};
const state = {
  screen: "menu", // menu | quiz | done | stats
  mode: "conj",
  ...DEFAULT_SETTINGS,
  ...loadJSON(SETTINGS_KEY, {}),
  q: null,
  picked: null,      // vybraná/napsaná odpověď
  accentWarn: false, // psaní: správně, ale bez diakritiky
  stamp: "",
  score: { ok: 0, total: 0, streak: 0 },
  history: loadJSON(HIST_KEY, []),
  stats: loadJSON(STATS_KEY, {}),
  days: loadJSON(DAYS_KEY, {}), // "YYYY-MM-DD" → počet odpovědí
  queue: [], // fronta statId pro režimy due/errs
  qi: 0,
  cteIdx: 0,     // čtení: index aktuálního textu
  cteQ: 0,       // čtení: index otázky v textu
  lastText: null,
};
// uložené časy ořež na aktuální úroveň; prázdné → preset úrovně
state.tenseIds = state.tenseIds.filter((id) => {
  const t = TENSES.find((x) => x.id === id);
  return t && LVL[t.lvl] <= LVL[state.level];
});
if (!state.tenseIds.length) state.tenseIds = tensePreset(state.level);

function saveSettings() {
  saveJSON(SETTINGS_KEY, {
    level: state.level, tenseIds: state.tenseIds, grp: state.grp,
    sessionLen: state.sessionLen, ans: state.ans, smart: state.smart, sound: state.sound,
    goal: state.goal, vocabSrc: state.vocabSrc,
  });
}

function getPool() {
  return VERBS.filter((v) =>
    lvlOk(v.lvl, "B1") &&
    (state.grp === "all" ? true : state.grp === "reg" ? v.grp === "reg" : v.grp !== "reg")
  );
}
const nounPool = () => NOUNS.filter((n) => lvlOk(n.lvl, "A2"));
// režimy dostupné na dané úrovni (věty PC×imp až od A2, kde je PC)
const mixModes = () => {
  const m = ["conj", "conj", "conj", "frcz", "czfr", "num", "gen", "gen", "gram", "gram"];
  if (LVL[state.level] >= LVL.A2) m.push("sent", "sent");
  return m;
};
// slovíčka: slovesa / tematická zásoba / obojí, dle nastavení a úrovně
function vocabItems() {
  const verbs = getPool().map((v) => ({ fr: v.inf, cz: v.cz, th: null }));
  const themes = VOCAB.filter((v) => lvlOk(v.lvl, "A2")).map((v) => ({ fr: v.fr, cz: v.cz, th: v.th }));
  return state.vocabSrc === "verbs" ? verbs : state.vocabSrc === "themes" ? themes : verbs.concat(themes);
}

// ── Generování otázek ───────────────────────────────────────
// q: { key, statId, prompt, big, sub, correct, options?, accepted?,
//      answerType: "choice"|"text", dict?, prefix?, inputMode?, audio?, why?, sayAfter? }

// stavitelé jednotlivých typů (sdílené režimy i frontou due/errs)
function buildConj(verb, tense, i) {
  const correct = conjDisplay(verb, tense, i);
  const q = {
    key: "c|" + verb.inf + "|" + tense + "|" + i,
    statId: "c|" + verb.inf + "|" + tense,
    prompt: verb.inf,
    sub: verb.cz + " · " + TENSE_LABEL[tense],
    big: (tense === "subj" ? typePrefix("subj", i) : PRONOUNS[i]) + " … ?",
    correct,
  };
  if (state.ans === "text") {
    q.answerType = "text";
    q.prefix = typePrefix(tense, i);
    q.accepted = [conjBare(verb, tense, i)];
  } else {
    q.answerType = "choice";
    const set = new Set();
    for (const t of TENSES.filter((t) => LVL[t.lvl] <= LVL[state.level])) {
      for (let p = 0; p < 6; p++) {
        const f = conjDisplay(verb, t.id, p);
        if (f !== correct) set.add(f);
      }
    }
    q.options = shuffle([correct, ...shuffle([...set]).slice(0, 3)]);
  }
  return q;
}

function buildVocab(item, dir, items) {
  // distraktory nejlépe ze stejného tématu
  let others = items.filter((x) => x.fr !== item.fr && item.th && x.th === item.th);
  if (others.length < 3) others = items.filter((x) => x.fr !== item.fr);
  others = shuffle(others).slice(0, 3);
  if (dir === "frcz") {
    return {
      key: "frcz|" + item.fr, statId: "v|" + item.fr,
      prompt: "Co znamená…", sub: "vyber český význam",
      big: item.fr, correct: item.cz,
      answerType: "choice",
      options: shuffle([item.cz, ...others.map((x) => x.cz)]),
      audio: state.sound ? item.fr : null,
    };
  }
  const q = {
    key: "czfr|" + item.fr, statId: "v|" + item.fr,
    prompt: "Jak se řekne…",
    big: item.cz, correct: item.fr,
    sayAfter: state.sound ? item.fr : null,
  };
  if (state.ans === "text") {
    q.answerType = "text";
    q.sub = "napiš francouzsky";
    q.accepted = [item.fr];
  } else {
    q.answerType = "choice";
    q.sub = "vyber francouzsky";
    q.options = shuffle([item.fr, ...others.map((x) => x.fr)]);
  }
  return q;
}

function numOptions(n) {
  const ds = new Set([n]);
  for (let g = 0; ds.size < 4 && g < 50; g++) ds.add(numDistractor(n));
  while (ds.size < 4) ds.add(rnd(101)); // pojistka: málo kandidátů (např. n=0)
  return [...ds];
}

function buildNum(n) {
  const word = frNumber(n);
  const q = {
    key: "num|" + n, statId: "n|" + Math.floor(n / 10) * 10,
    prompt: "Jak se řekne francouzsky…",
    big: String(n), sub: "",
    correct: word,
    sayAfter: state.sound ? word : null,
  };
  if (state.ans === "text") { q.answerType = "text"; q.accepted = [word]; }
  else { q.answerType = "choice"; q.options = shuffle(numOptions(n).map(frNumber)); }
  return q;
}

function buildNumListen(n) {
  const q = {
    key: "numL|" + n, statId: "n|" + Math.floor(n / 10) * 10,
    prompt: "Poslouchej a napiš číslo",
    big: "🔊", audio: frNumber(n), sub: "klikni na 🔊 pro přehrání",
    correct: String(n),
  };
  if (state.ans === "text") { q.answerType = "text"; q.accepted = [String(n)]; q.inputMode = "numeric"; }
  else { q.answerType = "choice"; q.options = shuffle(numOptions(n).map(String)); }
  return q;
}

function buildGen(noun) {
  return {
    key: "g|" + noun.n, statId: "g|" + noun.n,
    prompt: "un, nebo une?",
    big: "… " + noun.n, sub: noun.cz,
    correct: noun.g === "m" ? "un" : "une",
    answerType: "choice",
    options: ["un", "une"],
    sayAfter: state.sound ? (noun.g === "m" ? "un " : "une ") + noun.n : null,
  };
}

function buildSent(si) {
  const sn = SENTENCES[si];
  const verb = VERBS.find((v) => v.inf === sn.inf);
  const impF = conjBare(verb, "imp", sn.p);
  const pcF = conjBare(verb, "pc", sn.p);
  return {
    key: "s|" + si, statId: "s|" + si,
    prompt: "Doplň správný čas:",
    big: sn.s, bigClass: "sentence",
    sub: sn.inf + " (" + verb.cz + ")",
    correct: sn.t === "imp" ? impF : pcF,
    answerType: "choice",
    options: shuffle([impF, pcF]),
    why: sn.why,
    sayAfter: state.sound ? sn.s.replace("___", sn.t === "imp" ? impF : pcF) : null,
  };
}

function buildGram(gi) {
  const g = GRAMMAR[gi];
  return {
    key: "gr|" + gi, statId: "gr|" + gi,
    prompt: "Gramatika · " + g.topic,
    big: g.s, bigClass: "sentence",
    sub: "",
    correct: g.c,
    answerType: "choice",
    options: shuffle([...g.o]),
    why: g.why || null,
    sayAfter: state.sound ? g.s.replace("___", g.c) : null,
  };
}

function buildDict(di) {
  const d = DICT[di];
  return {
    key: "d|" + di, statId: "d|" + di,
    prompt: "Diktát",
    big: "🔊", audio: d.s,
    sub: "poslouchej (🔊 přehraje znovu) a napiš celou větu",
    correct: d.s,
    answerType: "text", dict: true,
    accepted: [d.s],
  };
}

// otázka z uloženého statId (fronty due/errs)
function questionFromStatId(id) {
  const p = id.split("|");
  if (p[0] === "c") {
    const verb = VERBS.find((v) => v.inf === p[1]);
    if (!verb || !TENSE_LABEL[p[2]]) return null;
    return buildConj(verb, p[2], rnd(6));
  }
  if (p[0] === "v") {
    const items = vocabItems();
    let item = items.find((x) => x.fr === p[1]);
    if (!item) {
      const verb = VERBS.find((v) => v.inf === p[1]);
      const voc = VOCAB.find((v) => v.fr === p[1]);
      item = verb ? { fr: verb.inf, cz: verb.cz, th: null } : voc ? { fr: voc.fr, cz: voc.cz, th: voc.th } : null;
    }
    if (!item) return null;
    const poolItems = items.length >= 4 ? items : vocabItems();
    return buildVocab(item, Math.random() < 0.5 ? "frcz" : "czfr", poolItems);
  }
  if (p[0] === "n") {
    const dec = Number(p[1]);
    const n = Math.min(100, dec + rnd(10));
    return buildNum(n);
  }
  if (p[0] === "g") {
    const noun = NOUNS.find((x) => x.n === p[1]);
    return noun ? buildGen(noun) : null;
  }
  if (p[0] === "s") return SENTENCES[Number(p[1])] ? buildSent(Number(p[1])) : null;
  if (p[0] === "gr") return GRAMMAR[Number(p[1])] ? buildGram(Number(p[1])) : null;
  if (p[0] === "d") return DICT[Number(p[1])] ? buildDict(Number(p[1])) : null;
  return null;
}

function makeQuestion() {
  // fronty (opakování / moje chyby): otázky z uložených id
  if (state.mode === "due" || state.mode === "errs") {
    while (state.qi < state.queue.length) {
      const q = questionFromStatId(state.queue[state.qi]);
      if (q) return q;
      state.qi++; // nerozložitelné id (smazaná položka) přeskoč
    }
    return null;
  }

  const pool = getPool();
  const prevKey = state.q && state.q.key;
  const K = state.smart ? 6 : 1;

  for (let attempt = 0; attempt < 20; attempt++) {
    const mode = state.mode === "mix" ? pick(mixModes()) : state.mode;

    if (mode === "conj") {
      const cands = Array.from({ length: K }, () => ({
        verb: pick(pool), tense: pick(state.tenseIds), i: rnd(6),
      }));
      const c = sampleWeighted(cands, (x) => "c|" + x.verb.inf + "|" + x.tense);
      const q = buildConj(c.verb, c.tense, c.i);
      if (q.key === prevKey) continue;
      return q;
    }

    if (mode === "frcz" || mode === "czfr") {
      const items = vocabItems();
      const cands = Array.from({ length: K }, () => pick(items));
      const item = sampleWeighted(cands, (x) => "v|" + x.fr);
      const q = buildVocab(item, mode, items);
      if (q.key === prevKey) continue;
      return q;
    }

    if (mode === "sent") {
      const cands = Array.from({ length: K }, () => rnd(SENTENCES.length));
      const si = sampleWeighted(cands, (i) => "s|" + i);
      if ("s|" + si === (prevKey || "")) continue;
      return buildSent(si);
    }

    if (mode === "gram") {
      const idxs = GRAMMAR.map((_, i) => i).filter((i) => lvlOk(GRAMMAR[i].lvl, "B1"));
      const cands = Array.from({ length: K }, () => pick(idxs));
      const gi = sampleWeighted(cands, (i) => "gr|" + i);
      const q = buildGram(gi);
      if (q.key === prevKey) continue;
      return q;
    }

    if (mode === "dict") {
      const idxs = DICT.map((_, i) => i).filter((i) => lvlOk(DICT[i].lvl, "B1"));
      const cands = Array.from({ length: K }, () => pick(idxs));
      const di = sampleWeighted(cands, (i) => "d|" + i);
      const q = buildDict(di);
      if (q.key === prevKey) continue;
      return q;
    }

    if (mode === "num") {
      const cands = Array.from({ length: K }, () => rnd(101));
      const n = sampleWeighted(cands, (x) => "n|" + Math.floor(x / 10) * 10);
      const listening = state.sound && TTS_OK && Math.random() < 0.5;
      const q = listening ? buildNumListen(n) : buildNum(n);
      if (q.key === prevKey) continue;
      return q;
    }

    if (mode === "gen") {
      const nouns = nounPool();
      const cands = Array.from({ length: K }, () => pick(nouns));
      const noun = sampleWeighted(cands, (x) => "g|" + x.n);
      const q = buildGen(noun);
      if (q.key === prevKey) continue;
      return q;
    }

    if (mode === "cete") {
      const T = TEXTS[state.cteIdx];
      const qd = T.qs[state.cteQ];
      const vf = qd.o.length === 2 && qd.o[0] === "Vrai";
      return {
        key: "t|" + state.cteIdx + "|" + state.cteQ,
        statId: "t|" + state.cteIdx,
        prompt: "Otázka " + (state.cteQ + 1) + " / " + T.qs.length,
        big: qd.q, bigClass: "sentence",
        sub: "",
        correct: qd.c,
        answerType: "choice",
        options: vf ? [...qd.o] : shuffle([...qd.o]),
        why: qd.why || null,
      };
    }
  }
  return null;
}

// výběr textu pro čtení (vážený chybovostí, bez okamžitého opakování)
function pickText() {
  let idxs = TEXTS.map((_, i) => i).filter((i) => lvlOk(TEXTS[i].level, "B1"));
  if (!idxs.length) idxs = TEXTS.map((_, i) => i);
  if (idxs.length > 1 && state.lastText !== null) {
    idxs = idxs.filter((i) => i !== state.lastText);
  }
  const cands = state.smart
    ? Array.from({ length: Math.min(6, idxs.length) }, () => pick(idxs))
    : [pick(idxs)];
  return sampleWeighted(cands, (i) => "t|" + i);
}

// věrohodné číselné distraktory (prohozené desítky/jednotky, ±1, ±10…)
function numDistractor(n) {
  const cand = [];
  const t = Math.floor(n / 10), u = n % 10;
  if (t !== u && u * 10 + t <= 100) cand.push(u * 10 + t); // 42 → 24
  if (n + 10 <= 100) cand.push(n + 10);
  if (n - 10 >= 0) cand.push(n - 10);
  if (n + 1 <= 100) cand.push(n + 1);
  if (n - 1 >= 0) cand.push(n - 1);
  if (n >= 60 && n <= 79) cand.push(n + 20 <= 100 ? n + 20 : n - 20); // 70 × 90
  if (n >= 80) cand.push(n - 20);
  const c = pick(cand);
  return c === n ? rnd(101) : c;
}

// ── Akce ────────────────────────────────────────────────────
function start(mode) {
  state.mode = mode;
  state.score = { ok: 0, total: 0, streak: 0 };
  if (mode === "due") {
    state.queue = shuffle(dueIds()).slice(0, 50);
    state.qi = 0;
  }
  if (mode === "errs") {
    state.queue = shuffle(errIds());
    state.qi = 0;
  }
  if (mode === "cete") {
    state.cteIdx = pickText();
    state.lastText = state.cteIdx;
    state.cteQ = 0;
  }
  state.q = null;
  state.q = makeQuestion();
  state.picked = null;
  state.accentWarn = false;
  state.screen = "quiz";
  render();
  if (state.q && state.q.audio) speak(state.q.audio);
}

function applyAnswer(ok, displayPicked) {
  state.picked = displayPicked;
  state.stamp = ok ? pick(PRAISE) : pick(OOPS);
  state.score.ok += ok ? 1 : 0;
  state.score.total += 1;
  state.score.streak = ok ? state.score.streak + 1 : 0;
  recStat(state.q.statId, ok);
  render();
  if (state.q.sayAfter) speak(state.q.sayAfter);
}

function answerChoice(opt) {
  if (state.picked !== null) return;
  applyAnswer(opt === state.q.correct, opt);
}

// diktát: tokenizace a porovnání po slovech
const dictTok = (s) =>
  String(s).toLowerCase().replace(/[’']/g, "").replace(/[.,!?;:«»"()\-—…]/g, " ").split(/\s+/).filter(Boolean);
function dictEval(input, target) {
  const exp = dictTok(target);
  const got = dictTok(input);
  const marks = exp.map((w, i) => {
    if (got[i] === w) return 2;
    if (got[i] && stripAcc(got[i]) === stripAcc(w)) return 1;
    return 0;
  });
  let ok = got.length === exp.length && marks.every((m) => m > 0);
  let accentWarn = ok && marks.some((m) => m === 1);
  // fallback: apostrofy psané mezerou (m appelle, aujourd hui) — porovnej slepené
  if (!ok) {
    const sq = (x) => dictTok(x).join("");
    if (sq(input) === sq(target)) {
      ok = true;
      for (let i = 0; i < marks.length; i++) marks[i] = 2;
    } else if (stripAcc(sq(input)) === stripAcc(sq(target))) {
      ok = true; accentWarn = true;
      for (let i = 0; i < marks.length; i++) marks[i] = 2;
    }
  }
  return { marks, ok, accentWarn };
}
function answerTyped(text) {
  if (state.picked !== null || !text.trim()) return;
  if (state.q.dict) {
    const r = dictEval(text, state.q.correct);
    state.dictMarks = r.marks;
    state.accentWarn = r.accentWarn;
    applyAnswer(r.ok, text.trim());
    return;
  }
  const m = matchTyped(text, state.q.accepted);
  state.accentWarn = m === 1;
  applyAnswer(m > 0, text.trim());
}

function next() {
  if (state.mode === "due" || state.mode === "errs") {
    state.qi++;
    if (state.qi >= state.queue.length) { finish(); return; }
    state.q = makeQuestion();
    state.picked = null;
    state.accentWarn = false;
    if (!state.q) { finish(); return; }
    render();
    if (state.q.audio) speak(state.q.audio);
    return;
  }
  if (state.mode === "cete") {
    if (state.cteQ >= TEXTS[state.cteIdx].qs.length - 1) {
      finish();
      return;
    }
    state.cteQ++;
  } else if (state.sessionLen > 0 && state.score.total >= state.sessionLen) {
    finish();
    return;
  }
  state.q = makeQuestion();
  state.picked = null;
  state.accentWarn = false;
  render();
  if (state.q && state.q.audio) speak(state.q.audio);
}

function finish() {
  if (state.score.total > 0) {
    const entry = {
      d: Date.now(), m: state.mode, g: state.grp,
      ok: state.score.ok, t: state.score.total,
    };
    state.history = [entry, ...state.history].slice(0, 30);
    saveJSON(HIST_KEY, state.history);
    state.screen = "done";
  } else {
    state.screen = "menu";
  }
  render();
}

function toggleTense(id) {
  const cur = state.tenseIds;
  if (cur.includes(id)) {
    if (cur.length > 1) state.tenseIds = cur.filter((t) => t !== id);
  } else {
    state.tenseIds = [...cur, id];
  }
  saveSettings();
  render();
}

// ── Render ──────────────────────────────────────────────────
const app = document.getElementById("app");
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

function chipRow(items, isOn, action) {
  return '<div class="chipRow">' + items.map((it) =>
    '<button class="chip' + (isOn(it) ? " on" : "") + '" data-action="' + action + '" data-id="' + esc(it.id) + '">' + esc(it.label) + "</button>"
  ).join("") + "</div>";
}

function renderMenu() {
  const pool = getPool();
  let html =
    '<h1 class="title">Mon cahier de français</h1>' +
    '<p class="subtitle">procvičování francouzštiny · úroveň ' + state.level + " · v" + APP_VERSION + "</p>";

  html += '<div class="card"><span class="label">Úroveň</span>' +
    chipRow(LEVELS.map((l) => ({ id: l, label: l })), (l) => state.level === l.id, "level") +
    '<div style="height:14px"></div><span class="label">Slovesa (' + pool.length + ')</span>' +
    chipRow(
      [{ id: "all", label: "Všechna" }, { id: "irr", label: "Nepravidelná" }, { id: "reg", label: "Pravidelná" }],
      (g) => state.grp === g.id, "grp"
    ) +
    '<div style="height:14px"></div><span class="label">Časy (časování)</span>' +
    chipRow(TENSES.filter((t) => LVL[t.lvl] <= LVL[state.level]), (t) => state.tenseIds.includes(t.id), "tense") +
    '<div style="height:14px"></div><span class="label">Počet otázek</span>' +
    chipRow(LENGTHS, (l) => state.sessionLen === l.id, "len") +
    '<div style="height:14px"></div><span class="label">Denní cíl</span>' +
    chipRow([{ id: 10, label: "10" }, { id: 20, label: "20" }, { id: 50, label: "50" }], (g) => state.goal === g.id, "goal") +
    '<div style="height:14px"></div><span class="label">Slovíčka</span>' +
    chipRow(
      [{ id: "all", label: "Vše" }, { id: "verbs", label: "Jen slovesa" }, { id: "themes", label: "Jen témata" }],
      (v) => state.vocabSrc === v.id, "vocab-src"
    ) +
    '<div style="height:14px"></div><span class="label">Další volby</span>' +
    chipRow(
      [
        { id: "ans", label: state.ans === "text" ? "✍ psaní odpovědí" : "✍ psaní odpovědí" },
        { id: "smart", label: "🧠 chytré opakování" },
        ...(TTS_OK ? [{ id: "sound", label: "🔊 zvuk" }] : []),
      ],
      (o) => (o.id === "ans" ? state.ans === "text" : state[o.id]),
      "toggle"
    ) +
    (state.sound && TTS_OK ? (() => {
      const d = voiceDiag();
      return d ? '<p class="voiceDiag' + (d.ok ? "" : " warn") + '">' + esc(d.msg) + "</p>" : "";
    })() : "") +
    "</div>";

  const si = streakInfo();
  const nDue = dueIds().length;
  const nErr = errIds().length;
  html += '<span class="label secLabel">Denní trénink</span>';
  html += '<div class="card streakCard">' +
    '<div class="streakLine">🔥 Série: <b>' + si.streak + "</b> " + (si.streak === 1 ? "den" : si.streak >= 2 && si.streak <= 4 ? "dny" : "dní") +
    ' · dnes <b>' + si.today + "</b> / " + state.goal + "</div>" +
    '<div class="hm">' + Array.from({ length: 28 }, (_, i) => {
      const c = state.days[todayKey(27 - i)] || 0;
      return '<span class="hmd' + (c >= state.goal ? " g" : c > 0 ? " p" : "") + '"></span>';
    }).join("") + "</div></div>";
  html +=
    '<button class="modeBtn" data-action="start" data-id="mix">🎲 Mix — všechno dohromady<small>časování, slovíčka, gramatika, čísla, rody' + (LVL[state.level] >= LVL.A2 ? ", věty" : "") + " v jednom kole</small></button>" +
    (nDue > 0 ? '<button class="modeBtn" data-action="start" data-id="due">📅 K zopakování dnes (' + nDue + ')<small>co je podle rozvrhu opakování na řadě</small></button>' : "") +
    (nErr > 0 ? '<button class="modeBtn" data-action="start" data-id="errs">🔁 Moje chyby<small>kolo jen z toho, co se nedávno nepovedlo</small></button>' : "") +
    '<span class="label secLabel">Cvičení</span>' +
    '<button class="modeBtn" data-action="start" data-id="conj">Časování<small>nous + prendre → nous prenons</small></button>' +
    '<button class="modeBtn" data-action="start" data-id="gram">Gramatika<small>členy, předložky, zájmena, subjonctif… doplň do věty</small></button>' +
    (LVL[state.level] >= LVL.A2 ? '<button class="modeBtn" data-action="start" data-id="sent">Passé composé × imparfait<small>doplň správný čas do věty</small></button>' : "") +
    '<button class="modeBtn" data-action="start" data-id="frcz">Slovíčka: francouzsky → česky<small>mettre → dát, položit</small></button>' +
    '<button class="modeBtn" data-action="start" data-id="czfr">Slovíčka: česky → francouzsky<small>slíbit → promettre</small></button>' +
    '<button class="modeBtn" data-action="start" data-id="cete">Porozumění textu (DELF)<small>přečti text a odpověz na otázky · ' + TEXTS.filter((t) => lvlOk(t.level, "B1")).length + " textů</small></button>" +
    '<button class="modeBtn" data-action="start" data-id="num">Čísla 0–100<small>42 → quarante-deux' + (TTS_OK ? " (se zvukem i poslech)" : "") + "</small></button>" +
    '<button class="modeBtn" data-action="start" data-id="gen">Rody: un / une<small>… problème? un!</small></button>' +
    (TTS_OK ? '<button class="modeBtn" data-action="start" data-id="dict">Diktát (dictée)<small>poslouchej větu a napiš ji</small></button>' : "") +
    '<button class="modeBtn" data-action="show-stats">📊 Statistiky chyb<small>co jde nejhůř a co procvičit</small></button>' +
    '<button class="modeBtn" data-action="show-help">ℹ️ Nápověda<small>co dělají režimy a nastavení</small></button>';

  if (state.history.length > 0) {
    html += '<div class="card"><div class="histHead"><span class="label">Historie</span>' +
      '<button class="histClear" data-action="clear-history">smazat</button></div>';
    for (const h of state.history.slice(0, 8)) {
      const p = Math.round((100 * h.ok) / h.t);
      const cls = p >= 80 ? " hi" : p < 50 ? " lo" : "";
      html += '<div class="histRow"><span class="histDate">' + fmtDate(h.d) + "</span>" +
        '<span class="histMode">' + MODE_LABEL[h.m] + (h.m === "conj" || h.m === "frcz" || h.m === "czfr" ? " · " + GRP_LABEL[h.g] : "") + "</span>" +
        '<span class="histScore' + cls + '">' + h.ok + "/" + h.t + " · " + p + " %</span></div>";
    }
    html += "</div>";
  }
  return html;
}

function renderQuiz() {
  const s = state.score;
  const q = state.q;
  const isCete = state.mode === "cete";
  let progress = "";
  if (state.mode === "due" || state.mode === "errs") {
    progress = Math.min(state.qi + 1, state.queue.length) + " / " + state.queue.length + " · ";
  } else if (isCete) {
    progress = Math.min(state.cteQ + 1, TEXTS[state.cteIdx].qs.length) + " / " + TEXTS[state.cteIdx].qs.length + " · ";
  } else if (state.sessionLen > 0) {
    const cur = Math.min(s.total + (state.picked === null ? 1 : 0), state.sessionLen);
    progress = cur + " / " + state.sessionLen + " · ";
  }
  let html =
    '<div class="topbar">' +
    '<button class="back" data-action="finish">' + (s.total > 0 ? "← ukončit" : "← menu") + "</button>" +
    '<div class="scorebox">' + progress + "<b>" + s.ok + "</b> správně" +
    (s.streak >= 3 ? ' · <span class="streak">🔥 ' + s.streak + "</span>" : "") +
    "</div></div>";

  if (isCete) {
    const T = TEXTS[state.cteIdx];
    html += '<div class="card textCard">' +
      '<div class="labelRow"><span class="label">' + esc(T.title) + " · " + esc(T.level) + "</span>" +
      (state.sound && TTS_OK ? '<button class="histClear" data-action="read-text">🔊 přečíst</button>' : "") +
      "</div>" +
      '<p class="readText">' + esc(T.text) + "</p></div>";
  }

  html += '<div class="card">' +
    '<p class="qPrompt">' + esc(q.prompt) + "</p>" +
    '<p class="qBig' + (q.bigClass ? " " + q.bigClass : "") + '">' + esc(q.big) + "</p>" +
    (q.sub ? '<p class="qSub">' + esc(q.sub) + "</p>" : "");

  if (q.audio) {
    html += '<button class="speakBtn" data-action="replay" aria-label="Přehrát znovu">🔊</button>';
  }

  if (q.answerType === "choice") {
    q.options.forEach((opt, idx) => {
      let cls = "opt";
      if (state.picked !== null) {
        if (opt === q.correct) cls += " good";
        else if (opt === state.picked) cls += " bad";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" data-action="answer" data-id="' + idx + '"' +
        (state.picked !== null ? " disabled" : "") + ">" + esc(opt) + "</button>";
    });
  } else if (state.picked === null) {
    html += '<div class="typeRow">' +
      (q.prefix ? '<span class="typePrefix">' + esc(q.prefix) + "</span>" : "") +
      '<input class="typeInput" id="typeInput" autocomplete="off" autocapitalize="off" spellcheck="false"' +
      (q.inputMode ? ' inputmode="' + q.inputMode + '"' : "") + ">" +
      '<button class="typeOk" data-action="submit-typed">OK</button></div>';
  } else if (q.dict) {
    // diktát: očekávaná věta se značkami po slovech + co napsala
    const expWords = q.correct.split(/\s+/);
    const toks = dictTok(q.correct);
    let ti = 0;
    html += '<div class="typedAnswer dictDiff">' + expWords.map((w) => {
      const hasTok = dictTok(w).length > 0;
      const m = hasTok ? (state.dictMarks || [])[ti++] : 2;
      const cls = m === 2 ? "dw good" : m === 1 ? "dw acc" : "dw bad";
      return '<span class="' + cls + '">' + esc(w) + "</span>";
    }).join(" ") + "</div>";
    html += '<div class="dictYours">napsáno: ' + esc(state.picked) + "</div>";
  } else {
    const ok = state.accentWarn || matchTyped(state.picked, q.accepted) > 0;
    html += '<div class="typedAnswer">' +
      (q.prefix ? esc(q.prefix) + " " : "") +
      (ok ? "<b>" + esc(state.picked) + "</b>" : '<span class="wrong">' + esc(state.picked) + "</span>") +
      "</div>";
  }

  if (state.picked !== null) {
    const ok = q.answerType === "choice"
      ? state.picked === q.correct
      : q.dict
        ? dictEval(state.picked, q.correct).ok
        : matchTyped(state.picked, q.accepted) > 0;
    html += '<div class="stamp ' + (ok ? "ok" : "ko") + '">' + esc(state.stamp) + "</div>";
    if (state.accentWarn) {
      html += '<p class="accentNote">Pozor na akcenty' + (q.dict ? "" : ": " + esc(q.correct)) + "</p>";
    } else if (!ok && !q.dict) {
      html += '<p class="correction">→ ' + esc(q.correct) + "</p>";
    }
    if (q.why) html += '<p class="why">' + esc(q.why) + "</p>";
    const last = state.mode === "cete"
      ? state.cteQ >= TEXTS[state.cteIdx].qs.length - 1
      : state.mode === "due" || state.mode === "errs"
        ? state.qi >= state.queue.length - 1
        : state.sessionLen > 0 && s.total >= state.sessionLen;
    html += '<button class="nextBtn" data-action="next">' + (last ? "Výsledek →" : "Další →") + "</button>";
  }
  html += "</div>";
  return html;
}

function renderDone() {
  const s = state.score;
  const pct = Math.round((100 * s.ok) / s.total);
  const grade = pct >= 90 ? "Excellent !" : pct >= 70 ? "Très bien !" : pct >= 50 ? "Pas mal !" : "On continue !";
  return '<div class="card doneCard">' +
    '<div class="doneStamp">' + grade + "</div>" +
    '<div class="doneScore">' + s.ok + " / " + s.total + "</div>" +
    '<div class="donePct">' + pct + " % správně</div>" +
    '<div class="doneMeta">' + MODE_LABEL[state.mode] + "</div>" +
    '<button class="nextBtn" data-action="encore">Encore ! (ještě jednou)</button>' +
    '<button class="modeBtn doneMenuBtn" data-action="menu">Zpět do menu</button>' +
    "</div>";
}

// ── Statistiky ──────────────────────────────────────────────
function aggStats(prefix) {
  // vrátí mapu klíč(bez prefixu) → {o,b}
  const out = {};
  for (const [id, s] of Object.entries(state.stats)) {
    if (!id.startsWith(prefix)) continue;
    out[id.slice(prefix.length)] = { o: (out[id.slice(prefix.length)]?.o || 0) + s.o, b: (out[id.slice(prefix.length)]?.b || 0) + s.b };
  }
  return out;
}
function statRows(entries, nameFn, max, delSpec) {
  const rows = entries
    .map(([k, s]) => ({ k, ...s, n: s.o + s.b, r: s.b / (s.o + s.b) }))
    .filter((x) => x.b > 0)
    .sort((a, b) => b.r - a.r || b.b - a.b)
    .slice(0, max);
  if (!rows.length) return '<p class="statEmpty">Zatím žádné chyby. 🎉</p>';
  return rows.map((x) =>
    '<div class="statRow"><span class="statName">' + nameFn(x.k) + "</span>" +
    '<span class="statVal' + (x.r >= 0.4 ? " lo" : "") + '">' + x.b + "× chyba z " + x.n + " (" + Math.round(100 * (1 - x.r)) + " % úspěšnost)" +
    (delSpec ? ' <button class="knowBtn" data-action="mark-known" data-id="' + esc(delSpec(x.k)) + '" title="Vynulovat — tohle už umím">✓ umím</button>' : "") +
    "</span></div>"
  ).join("");
}
function renderStats() {
  let html = '<div class="topbar"><button class="back" data-action="menu">← menu</button></div>';
  html += '<h1 class="title">Statistiky chyb</h1><p class="subtitle">počítá se všechno napříč sessions (jen v tomhle zařízení)</p>';

  // slovesa: agregace c|inf|tense → per sloveso
  const byVerbTense = aggStats("c|");
  const byVerb = {};
  const byTense = {};
  for (const [k, s] of Object.entries(byVerbTense)) {
    const [inf, tense] = k.split("|");
    byVerb[inf] = { o: (byVerb[inf]?.o || 0) + s.o, b: (byVerb[inf]?.b || 0) + s.b };
    byTense[tense] = { o: (byTense[tense]?.o || 0) + s.o, b: (byTense[tense]?.b || 0) + s.b };
  }
  html += '<div class="card"><span class="label">Nejtěžší slovesa (časování)</span>' +
    statRows(Object.entries(byVerb), (k) => esc(k), 8, (k) => "c|" + k + "|") + "</div>";
  html += '<div class="card"><span class="label">Podle času</span>' +
    statRows(Object.entries(byTense), (k) => esc(TENSE_LABEL[k] || k), 7, null) + "</div>";
  html += '<div class="card"><span class="label">Slovíčka</span>' +
    statRows(Object.entries(aggStats("v|")), (k) => esc(k), 8, (k) => "v|" + k) + "</div>";
  html += '<div class="card"><span class="label">Čísla (podle desítek)</span>' +
    statRows(Object.entries(aggStats("n|")), (k) => esc(k) + "–" + (Number(k) + 9 > 100 ? 100 : Number(k) + 9), 5, (k) => "n|" + k) + "</div>";
  html += '<div class="card"><span class="label">Rody</span>' +
    statRows(Object.entries(aggStats("g|")), (k) => esc(k), 8, (k) => "g|" + k) + "</div>";
  html += '<div class="card"><span class="label">PC × imparfait (věty)</span>' +
    statRows(Object.entries(aggStats("s|")), (k) => esc((SENTENCES[Number(k)] || {}).s || "věta " + k), 5, (k) => "s|" + k) + "</div>";
  html += '<div class="card"><span class="label">Gramatika</span>' +
    statRows(Object.entries(aggStats("gr|")), (k) => esc((GRAMMAR[Number(k)] || {}).s || "položka " + k), 8, (k) => "gr|" + k) + "</div>";
  html += '<div class="card"><span class="label">Diktáty</span>' +
    statRows(Object.entries(aggStats("d|")), (k) => esc((DICT[Number(k)] || {}).s || "věta " + k), 5, (k) => "d|" + k) + "</div>";
  html += '<div class="card"><span class="label">Čtení (podle textu)</span>' +
    statRows(Object.entries(aggStats("t|")), (k) => esc((TEXTS[Number(k)] || {}).title || "text " + k), 5, (k) => "t|" + k) + "</div>";

  html += '<p class="statNote">Chytré opakování 🧠 z těchhle dat automaticky častěji vybírá to, kde jsou chyby. Tlačítkem „✓ umím“ položku vynuluješ — zmizí ze seznamu a přestane se protežovat. Když se chyby vrátí, objeví se tu zase.</p>';
  html += '<div class="card"><span class="label">Záloha dat</span>' +
    '<p class="statEmpty" style="margin-bottom:10px">Historie, statistiky i pokrok jsou jen v tomhle prohlížeči. Zálohou je přeneseš na jiné zařízení.</p>' +
    '<button class="modeBtn" data-action="export-data" style="margin-bottom:8px">⬇ Stáhnout zálohu</button>' +
    '<button class="modeBtn" data-action="import-data" style="margin-bottom:0">⬆ Obnovit ze zálohy</button>' +
    '<input type="file" id="importFile" accept="application/json" style="display:none">' +
    "</div>";
  html += '<button class="modeBtn" data-action="clear-stats">Smazat statistiky</button>';
  return html;
}

function exportData() {
  const payload = {
    app: "francouzstina", exported: new Date().toISOString(),
    history: state.history, stats: state.stats, days: state.days,
    settings: {
      level: state.level, tenseIds: state.tenseIds, grp: state.grp,
      sessionLen: state.sessionLen, ans: state.ans, smart: state.smart,
      sound: state.sound, goal: state.goal, vocabSrc: state.vocabSrc,
    },
  };
  const blob = new Blob([JSON.stringify(payload, null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "francouzstina-zaloha-" + todayKey() + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
}

function importData(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (d.app !== "francouzstina") throw new Error("cizí soubor");
      if (!confirm("Přepsat současný pokrok zálohou z " + (d.exported || "?").slice(0, 10) + "?")) return;
      state.history = d.history || [];
      state.stats = d.stats || {};
      state.days = d.days || {};
      Object.assign(state, d.settings || {});
      saveJSON(HIST_KEY, state.history);
      saveJSON(STATS_KEY, state.stats);
      saveJSON(DAYS_KEY, state.days);
      saveSettings();
      render();
    } catch (e) {
      alert("Tohle nevypadá jako záloha téhle appky.");
    }
  };
  r.readAsText(file);
}

    '<p><b>Počet otázek</b> — délka jednoho kola; u ∞ cvičíš, dokud nedáš „← ukončit“. U čtení je kolo vždy jeden text s otázkami.</p>' +
    '<p><b>Denní cíl a série 🔥</b> — kolik otázek denně chceš stihnout. Nahoře v menu vidíš dnešní počet, sérii dní se splněným cílem a mřížku posledních 28 dní (modrá = něco, zelená = cíl splněn).</p>' +
    '<p><b>✍ psaní odpovědí</b> — místo výběru ze 4 možností odpověď píšeš. Těžší, ale blíž zkoušce. Kontrola je tolerantní: chybějící háčky a čárky (<i>etais</i> místo <i>étais</i>) se počítají jako správně, jen s upozorněním „pozor na akcenty“; u čísel je jedno, jestli píšeš pomlčky, nebo mezery.</p>' +
    '<p><b>🧠 chytré opakování</b> — appka si (jen v tomhle prohlížeči) počítá, kde děláš chyby, a tyhle věci ti pak nabízí <b>častěji</b>. Nic víc v tom není — žádné plánování na dny dopředu, prostě „co ti nejde, chodí častěji“. Vypnuté = čistě náhodný výběr.</p>' +
    '<p><b>🔊 zvuk</b> — francouzské předčítání hlasem prohlížeče: slovíčka, čísla (i poslechové otázky), po odpovědi věty a <i>un/une + slovo</i>, u textů tlačítko „přečíst“. Pokud slyšíš angličtinu, chybí v zařízení francouzský hlas — na iPhonu: Nastavení → Zpřístupnění → Předčítání obsahu → Hlasy → Francouzština; na Androidu: nastavení Google TTS; na Windows: Nastavení → Čas a jazyk → Řeč → Přidat hlasy → Français, a pak restartovat prohlížeč.</p>' +
    '</div>' +

    '<div class="card helpCard"><span class="label">📊 Statistiky a „✓ umím“</span>' +
    '<p>Statistiky ukazují, co ti jde nejhůř — nejtěžší slovesa, časy, slovíčka, čísla, rody, věty i texty. Přesně z nich čerpá chytré opakování.</p>' +
    '<p>Tlačítko <b>„✓ umím“</b> vynuluje počítadlo dané položky: zmizí ze seznamu a přestane se ti podsouvat častěji. Není to napořád — když v ní zase uděláš chybu, objeví se tu znovu. Klidně mačkej, nic si tím nerozbiješ.</p>' +
    '</div>' +

    '<div class="card helpCard"><span class="label">Soukromí a data</span>' +
    '<p>Všechno (historie, statistiky, pokrok, nastavení) se ukládá jen v prohlížeči — nikam se nic neposílá, žádný účet. Data jsou tedy vázaná na konkrétní zařízení; ve Statistikách je ale tlačítko na stažení zálohy a její obnovení jinde (telefon ↔ počítač).</p>' +
    '</div>';
}

function render() {
  if (state.screen === "menu") app.innerHTML = renderMenu();
  else if (state.screen === "quiz") app.innerHTML = renderQuiz();
  else if (state.screen === "stats") app.innerHTML = renderStats();
  else if (state.screen === "help") app.innerHTML = renderHelp();
  else app.innerHTML = renderDone();
  const inp = document.getElementById("typeInput");
  if (inp) inp.focus();
}

app.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.dataset.action;
  const id = btn.dataset.id;
  if (action === "grp") { state.grp = id; saveSettings(); render(); }
  else if (action === "tense") toggleTense(id);
  else if (action === "len") { state.sessionLen = Number(id); saveSettings(); render(); }
  else if (action === "goal") { state.goal = Number(id); saveSettings(); render(); }
  else if (action === "vocab-src") { state.vocabSrc = id; saveSettings(); render(); }
  else if (action === "level") {
    state.level = id;
    state.tenseIds = tensePreset(id);
    saveSettings(); render();
  }
  else if (action === "read-text") speak(TEXTS[state.cteIdx].text);
  else if (action === "toggle") {
    if (id === "ans") state.ans = state.ans === "text" ? "choice" : "text";
    else state[id] = !state[id];
    saveSettings(); render();
  }
  else if (action === "start") start(id);
  else if (action === "answer") answerChoice(state.q.options[Number(id)]);
  else if (action === "submit-typed") answerTyped(document.getElementById("typeInput").value);
  else if (action === "replay") speak(state.q.audio);
  else if (action === "next") next();
  else if (action === "finish") finish();
  else if (action === "encore") start(state.mode);
  else if (action === "menu") { state.screen = "menu"; render(); }
  else if (action === "show-stats") { state.screen = "stats"; render(); }
  else if (action === "show-help") { state.screen = "help"; render(); }
  else if (action === "clear-history") {
    state.history = [];
    try { localStorage.removeItem(HIST_KEY); } catch {}
    render();
  }
  else if (action === "export-data") exportData();
  else if (action === "import-data") document.getElementById("importFile").click();
  else if (action === "mark-known") {
    const spec = id;
    for (const key of Object.keys(state.stats)) {
      if (key === spec || (spec.endsWith("|") && key.startsWith(spec))) delete state.stats[key];
    }
    saveJSON(STATS_KEY, state.stats);
    render();
  }
  else if (action === "clear-stats") {
    state.stats = {};
    try { localStorage.removeItem(STATS_KEY); } catch {}
    render();
  }
});

app.addEventListener("change", (e) => {
  if (e.target.id === "importFile" && e.target.files && e.target.files[0]) {
    importData(e.target.files[0]);
    e.target.value = "";
  }
});

app.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.id === "typeInput") {
    answerTyped(e.target.value);
  }
});

render();
</script>
</body>
</html>
