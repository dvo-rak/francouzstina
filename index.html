<script>
"use strict";

const APP_VERSION = "36 (2026-10-08)";

// ── Skládání tvarů ──────────────────────────────────────────
const PRONOUNS = ["je", "tu", "il", "nous", "vous", "ils"];
const AVOIR = ["ai", "as", "a", "avons", "avez", "ont"];
const ETRE = ["suis", "es", "est", "sommes", "êtes", "sont"];
const ALLER = ["vais", "vas", "va", "allons", "allez", "vont"];
const IMP_END = ["ais", "ais", "ait", "ions", "iez", "aient"];
const FS_END = ["ai", "as", "a", "ons", "ez", "ont"];
const TENSES = [
  { id: "present", label: "Présent", lvl: "A1" },
  { id: "futur", label: "Futur proche", lvl: "A1" },
  { id: "pc", label: "Passé composé", lvl: "A2" },
  { id: "imp", label: "Imparfait", lvl: "A2" },
  { id: "fs", label: "Futur simple", lvl: "B1" },
  { id: "cond", label: "Conditionnel", lvl: "B1" },
  { id: "subj", label: "Subjonctif", lvl: "B2" },
];
const LVL = { A1: 1, A2: 2, B1: 3, B2: 4 };
const LEVELS = ["A1", "A2", "B1", "B2"];
const lvlOk = (itemLvl, def) => LVL[itemLvl || def] <= LVL[state.level];
const tensePreset = (level) => TENSES.filter((t) => LVL[t.lvl] <= LVL[level]).map((t) => t.id);
const TENSE_LABEL = Object.fromEntries(TENSES.map((t) => [t.id, t.label]));

const startsVowel = (w) => /^[aeiouhâêéèàû]/i.test(w);
const joinPronoun = (i, rest) =>
  i === 0 && startsVowel(rest) ? "j'" + rest : PRONOUNS[i] + " " + rest;

// kmen imparfait/subjonctivu (nous-tvar bez -ons), s pravopisnou
// úpravou před koncovkami na -i (mangions, commencions)
const nousStem = (verb) => (verb.inf === "être" ? "ét" : verb.present[3].replace(/ons$/, ""));
const iAdjust = (stem) =>
  stem.endsWith("ge") ? stem.slice(0, -1) : stem.endsWith("ç") ? stem.slice(0, -1) + "c" : stem;
const futStem = (verb) =>
  FUT_STEMS[verb.inf] || (verb.inf.endsWith("re") ? verb.inf.slice(0, -1) : verb.inf);

// tvar bez zájmena
function conjBare(verb, tenseId, i) {
  if (tenseId === "present") return verb.present[i];
  if (tenseId === "futur") return ALLER[i] + " " + verb.inf;
  if (tenseId === "pc") {
    if (verb.aux === "etre") return ETRE[i] + " " + verb.pp + (i >= 3 ? "s" : "");
    return AVOIR[i] + " " + verb.pp;
  }
  if (tenseId === "imp") {
    const e = IMP_END[i];
    const st = e.startsWith("i") ? iAdjust(nousStem(verb)) : nousStem(verb);
    return st + e;
  }
  if (tenseId === "fs") return futStem(verb) + FS_END[i];
  if (tenseId === "cond") return futStem(verb) + IMP_END[i];
  // subjonctif
  if (SUBJ_FORMS[verb.inf]) return SUBJ_FORMS[verb.inf][i];
  const s1 = verb.present[5].replace(/ent$/, "");
  if (i === 3 || i === 4) return iAdjust(nousStem(verb)) + (i === 3 ? "ions" : "iez");
  return s1 + ["e", "es", "e", , , "ent"][i];
}

// tvar se zájmenem (subjonctif s "que")
function conjDisplay(verb, tenseId, i) {
  const base = joinPronoun(i, conjBare(verb, tenseId, i));
  if (tenseId !== "subj") return base;
  return (base.startsWith("il") ? "qu'" : "que ") + base;
}

// prefix pro psací režim (zájmeno, u subj s "que")
// prefix vlevo od psacího pole; u „je“ + samohlásky elize → j'
// (elided: true znamená, že se apostrof lepí přímo na pole bez mezery)
function typePrefix(tenseId, i, bare) {
  const elide = i === 0 && bare && startsVowel(bare);
  const p = elide ? "j'" : PRONOUNS[i];
  if (tenseId !== "subj") return { text: p, elided: elide };
  const q = p === "il" || p === "ils" ? "qu'" : "que ";
  return { text: q + p, elided: elide };
}

// ── Čísla 0–100 ─────────────────────────────────────────────
const NUM_UNITS = ["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix",
  "onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
const NUM_TENS = { 20: "vingt", 30: "trente", 40: "quarante", 50: "cinquante", 60: "soixante" };
function frNumber(n) {
  if (n === 100) return "cent";
  if (n < 20) return NUM_UNITS[n];
  if (n >= 80) {
    if (n === 80) return "quatre-vingts";
    return "quatre-vingt-" + NUM_UNITS[n - 80];
  }
  if (n >= 70) {
    if (n === 71) return "soixante et onze";
    return "soixante-" + NUM_UNITS[n - 60];
  }
  const t = Math.floor(n / 10) * 10, u = n % 10;
  if (u === 0) return NUM_TENS[t];
  if (u === 1) return NUM_TENS[t] + " et un";
  return NUM_TENS[t] + "-" + NUM_UNITS[u];
}

// švýcarská (romandská) varianta: septante / huitante / nonante
const CH_TENS = { 70: "septante", 80: "huitante", 90: "nonante" };
function chNumber(n) {
  if (n < 70 || n === 100) return frNumber(n);
  const t = Math.floor(n / 10) * 10, u = n % 10;
  if (u === 0) return CH_TENS[t];
  if (u === 1) return CH_TENS[t] + " et un";
  return CH_TENS[t] + "-" + NUM_UNITS[u];
}
// číslo v aktuálním stylu
const numWord = (n) => (state.numStyle === "ch" ? chNumber(n) : frNumber(n));
// přijímané zápisy: ve švýcarském stylu projde i francouzská forma
// (v Ženevě se pro 80 běžně říká quatre-vingts) a naopak
const numAccepted = (n) => [...new Set([numWord(n), frNumber(n), chNumber(n)])];

// ── Pomocné ─────────────────────────────────────────────────
const rnd = (n) => Math.floor(Math.random() * n);
const pick = (arr) => arr[rnd(arr.length)];
const shuffle = (arr) => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = rnd(i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

const PRAISE = ["Très bien !", "Parfait !", "Bravo !", "Excellent !", "Super !"];
const OOPS = ["Oh non…", "Presque !", "Pas tout à fait…", "Hmm…"];
const MODE_LABEL = {
  mix: "Mix", conj: "Časování", frcz: "FR → ČJ", czfr: "ČJ → FR",
  sent: "PC × Imparfait", num: "Čísla", gen: "Rody", cete: "Čtení",
  gram: "Gramatika", dict: "Diktát", due: "Opakování", errs: "Moje chyby",
  swiss: "Švýcarská fr.", pcaux: "PC: être × avoir", art: "Stažené členy", time: "Hodiny",
  pron: "Věty nahlas", pront: "Text nahlas",
};
const GRP_LABEL = { all: "všechna", irr: "nepravidelná", reg: "pravidelná" };
const LENGTHS = [
  { id: 10, label: "10" }, { id: 25, label: "25" },
  { id: 50, label: "50" }, { id: 0, label: "∞" },
];
const fmtDate = (ts) =>
  new Date(ts).toLocaleString("cs-CZ", {
    day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit",
  });

// normalizace psaných odpovědí
const normBase = (s) =>
  String(s).toLowerCase().trim()
    .replace(/[’']/g, "")
    .replace(/quatre[-\s]vingts/g, "quatre-vingt")
    .replace(/[-\s]+/g, " ");
const stripAcc = (s) => normBase(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "");
// vrací: 2 = přesně, 1 = správně až po odstranění diakritiky, 0 = špatně
function matchTyped(input, accepted) {
  for (const a of accepted) if (normBase(input) === normBase(a)) return 2;
  for (const a of accepted) if (stripAcc(input) === stripAcc(a)) return 1;
  return 0;
}

// ── Zvuk (Web Speech API) ───────────────────────────────────
const TTS_OK = "speechSynthesis" in window;
// u.lang samo o sobě řada prohlížečů ignoruje a čte výchozím
// (anglickým) hlasem — je nutné explicitně vybrat francouzský
// hlas z getVoices(). Seznam se navíc načítá asynchronně.
let frVoice = null;
function pickFrVoice() {
  if (!TTS_OK) return;
  const vs = speechSynthesis.getVoices();
  frVoice =
    vs.find((v) => /^fr[-_]FR/i.test(v.lang)) ||
    vs.find((v) => /^fr/i.test(v.lang)) ||
    vs.find((v) => /fran(ç|c)ais|french/i.test(v.name)) ||
    null;
}
// diagnostika pro menu: jaký hlas se reálně použije
function voiceDiag() {
  if (!TTS_OK) return null;
  pickFrVoice();
  if (frVoice) return { ok: true, msg: "Hlas: " + frVoice.name + " (" + frVoice.lang + ")" };
  const n = speechSynthesis.getVoices().length;
  if (n === 0) return { ok: false, msg: "Hlasy se ještě načítají — zkus přehrát první otázku a vrať se sem." };
  return { ok: false, msg: "Francouzský hlas v zařízení nenalezen (" + n + " hlasů, žádný fr) — předčítání bude anglicky. Návod na instalaci je v Nápovědě." };
}
if (TTS_OK) {
  pickFrVoice();
  speechSynthesis.onvoiceschanged = () => {
    pickFrVoice();
    if (state.screen === "menu") render(); // ať se diagnostika obnoví
  };
}
function speak(text) {
  if (!TTS_OK) return;
  try {
    if (!frVoice) pickFrVoice(); // hlasy se mohly načíst později
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (frVoice) u.voice = frVoice;
    u.lang = frVoice ? frVoice.lang : "fr-FR";
    u.rate = 0.85;
    speechSynthesis.speak(u);
  } catch {}
}

const HIST_KEY = "fr-cahier-history";
const STATS_KEY = "fr-cahier-stats";
const SETTINGS_KEY = "fr-cahier-settings";
const DAYS_KEY = "fr-cahier-days";
const HIDDEN_KEY = "fr-cahier-hidden";
function loadJSON(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch { return fallback; }
}
function saveJSON(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

// statistiky + Leitner SRS:
// { "<id>": { o, b, box: 1–5, due: timestamp } }
// správně → krabička +1 (max 5), chyba → krabička 1;
// intervaly krabiček: 1 / 3 / 7 / 14 / 30 dní
const BOX_DAYS = [0, 1, 3, 7, 14, 30];
function recStat(id, ok) {
  if (!id) return;
  const st = state.stats;
  if (!st[id]) st[id] = { o: 0, b: 0 };
  if (ok) st[id].o++; else st[id].b++;
  const box = ok ? Math.min((st[id].box || 0) + 1, 5) : 1;
  st[id].box = box;
  st[id].due = Date.now() + BOX_DAYS[box] * 864e5;
  saveJSON(STATS_KEY, st);
  // denní počítadlo (streak)
  const k = todayKey();
  state.days[k] = (state.days[k] || 0) + 1;
  for (const dk of Object.keys(state.days)) {
    if (Date.now() - new Date(dk).getTime() > 120 * 864e5) delete state.days[dk];
  }
  saveJSON(DAYS_KEY, state.days);
}
const pad2 = (n) => String(n).padStart(2, "0");
function todayKey(offsetDays) {
  const d = new Date(Date.now() - (offsetDays || 0) * 864e5);
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}
function streakInfo() {
  const today = state.days[todayKey()] || 0;
  let streak = 0;
  let i = today >= state.goal ? 0 : 1; // dnešek se počítá, až když je cíl splněný
  while ((state.days[todayKey(i)] || 0) >= state.goal) { streak++; i++; }
  return { today, streak };
}
// vyřazování z rotace (texty, věty, gramatika, diktáty)
const isHidden = (id) => state.hidden.includes(id);
function setHidden(id, on) {
  state.hidden = on ? [...new Set([...state.hidden, id])] : state.hidden.filter((x) => x !== id);
  saveJSON(HIDDEN_KEY, state.hidden);
}
// pool indexů s vynecháním vyřazených; když by nezbylo nic, vyřazení se ignoruje
function idxPool(arr, prefix, extraFilter) {
  let idxs = arr.map((_, i) => i).filter((i) => (!extraFilter || extraFilter(i)) && !isHidden(prefix + i));
  if (!idxs.length) idxs = arr.map((_, i) => i).filter((i) => !extraFilter || extraFilter(i));
  return idxs;
}

// položky k opakování / chybové (čtení t| se do front nehodí — je to celá session)
const dueIds = () =>
  Object.entries(state.stats)
    .filter(([id, s]) => s.due && s.due <= Date.now() && !/^(t|pr|px)\|/.test(id) && !isHidden(id))
    .map(([id]) => id);
const errIds = () =>
  Object.entries(state.stats)
    .filter(([id, s]) => s.b > 0 && !/^(t|pr|px)\|/.test(id) && !isHidden(id))
    .sort((a, b) => b[1].b / (b[1].o + b[1].b) - a[1].b / (a[1].o + a[1].b))
    .slice(0, 20)
    .map(([id]) => id);
const errWeight = (id) => {
  const s = state.stats[id];
  if (!s) return 1.3; // mírná preference dosud neviděných
  const n = s.o + s.b;
  return 1 + 6 * (s.b / n) * Math.min(1, n / 3);
};
function sampleWeighted(cands, idFn) {
  const ws = cands.map((c) => errWeight(idFn(c)));
  let sum = ws.reduce((a, b) => a + b, 0);
  let r = Math.random() * sum;
  for (let i = 0; i < cands.length; i++) {
    r -= ws[i];
    if (r <= 0) return cands[i];
  }
  return cands[cands.length - 1];
}

// q: { key, statId, prompt, big, sub, correct, options?, accepted?,
//      answerType: "choice"|"text", dict?, prefix?, inputMode?, audio?, why?, sayAfter?,

// stavitelé jednotlivých typů (sdílené režimy i frontou due/errs)
function buildConj(verb, tense, i) {
  const correct = conjDisplay(verb, tense, i);
  const q = {
    key: "c|" + verb.inf + "|" + tense + "|" + i,
    statId: "c|" + verb.inf + "|" + tense,
    prompt: verb.inf,
    sub: verb.cz + " · " + TENSE_LABEL[tense],
    big: (tense === "subj" ? (i === 2 || i === 5 ? "qu'" : "que ") + PRONOUNS[i] : PRONOUNS[i]) + " … ?",
    correct,
    say: correct,
  };
  if (state.ans === "text") {
    q.answerType = "text";
    const bare = conjBare(verb, tense, i);
    const pref = typePrefix(tense, i, bare);
    q.prefix = pref.text;
    q.prefixElided = pref.elided;
    // uznej samotný tvar i celý tvar se zájmenem (j'ai répondu)
    q.accepted = [bare, joinPronoun(i, bare)];
  } else {
    q.answerType = "choice";
    const set = new Set();
    for (const t of TENSES.filter((t) => LVL[t.lvl] <= LVL[state.level])) {
      for (let p = 0; p < 6; p++) {
        const f = conjDisplay(verb, t.id, p);
        if (f !== correct) set.add(f);
      }
    }
    q.options = shuffle([correct, ...shuffle([...set]).slice(0, 3)]);
  }
  return q;
}

function buildVocab(item, dir, items) {
  // distraktory nejlépe ze stejného tématu
  let others = items.filter((x) => x.fr !== item.fr && item.th && x.th === item.th);
  if (others.length < 3) others = items.filter((x) => x.fr !== item.fr);
  others = shuffle(others).slice(0, 3);
  if (dir === "frcz") {
    return {
      key: "frcz|" + item.fr, statId: "v|" + item.fr,
      prompt: "Co znamená…", sub: "vyber český význam",
      big: item.fr, correct: item.cz,
      answerType: "choice",
      options: shuffle([item.cz, ...others.map((x) => x.cz)]),
      audio: state.sound ? item.fr : null,
      say: item.fr,
    };
  }
  const q = {
    key: "czfr|" + item.fr, statId: "v|" + item.fr,
    prompt: "Jak se řekne…",
    big: item.cz, correct: item.fr,
    say: item.fr,

  if (state.ans === "text") {
    q.answerType = "text";
    q.sub = "napiš francouzsky";

  } else {
    q.answerType = "choice";
    q.sub = "vyber francouzsky";

  return q;
}

function numOptions(n) {

// ── Hodiny ──────────────────────────────────────────────────
// Past pro Čechy: čeština počítá k DALŠÍ hodině (půl čtvrté = 15:30),
// francouzština od PŘEDCHOZÍ (trois heures et demie). Distraktory na to cílí.
const CZ_NA = ["dvanáct", "jednu", "dvě", "tři", "čtyři", "pět", "šest", "sedm", "osm", "devět", "deset", "jedenáct"];
const CZ_GEN = ["dvanácté", "jedné", "druhé", "třetí", "čtvrté", "páté", "šesté", "sedmé", "osmé", "deváté", "desáté", "jedenácté"];
const CZ_NOM = ["dvanáct", "jedna", "dvě", "tři", "čtyři", "pět", "šest", "sedm", "osm", "devět", "deset", "jedenáct"];
const TIME_KIND_LABEL = {
  "00": "celé hodiny", "15": "et quart (čtvrt na…)", "30": "et demie (půl…)",
  "45": "moins le quart (tři čtvrtě na…)", po: "minuty po celé", pred: "moins … (minuty do celé)",
};
const TIME_TYPE_LABEL = { cz: "z češtiny", dig: "z digitálního času", fr: "z francouzštiny" };
const timeKind = (m) => (m === 0 ? "00" : m === 15 ? "15" : m === 30 ? "30" : m === 45 ? "45" : m < 30 ? "po" : "pred");
const fmtClock = (h, m) => h + ":" + pad2(m);

function frClockHour(h) {
  if (h === 0) return "minuit";
  if (h === 12) return "midi";
  const n = h % 12;
  return n === 1 ? "une heure" : frNumber(n) + " heures";
}
const frDayPart = (h) => (h === 0 || h === 12 ? "" : h < 12 ? " du matin" : h < 18 ? " de l'après-midi" : " du soir");
// hovorová francouzština (12h): trois heures et demie, quatre heures moins le quart…
function frTimeEveryday(h, m, withPart) {
  let H = h, s;
  if (m === 0) s = frClockHour(h);
  else if (m === 15) s = frClockHour(h) + " et quart";
  else if (m === 30) s = frClockHour(h) + (h === 0 || h === 12 ? " et demi" : " et demie");
  else if (m < 30) s = frClockHour(h) + " " + frNumber(m);
  else {
    H = (h + 1) % 24;
    s = frClockHour(H) + (m === 45 ? " moins le quart" : " moins " + frNumber(60 - m));
  }
  return s + (withPart ? frDayPart(H) : "");
}
// úřední (24h): quinze heures trente
function frTimeOfficial(h, m) {
  const hh = h === 0 ? "zéro heure" : h === 1 ? "une heure" : frNumber(h).replace(/ un$/, " une") + " heures";
  return hh + (m ? " " + frNumber(m) : "");
}
// česky hovorově, jen čtvrthodiny: půl čtvrté, čtvrt na čtyři, tři čtvrtě na čtyři
function czTime(h, m) {
  const nx = (h + 1) % 12;
  if (m === 15) return "čtvrt na " + CZ_NA[nx];
  if (m === 30) return "půl " + CZ_GEN[nx];
  if (m === 45) return "tři čtvrtě na " + CZ_NA[nx];
  if (h === 0) return "půlnoc";
  if (h === 12) return "poledne";
  const n = h % 12;
  return CZ_NOM[n] + (n === 1 ? " hodina" : n >= 2 && n <= 4 ? " hodiny" : " hodin");
}

// distraktory: nejdřív „česká past“ (±1 h, stejné minuty), pak ostatní čtvrthodiny / sousední minuty
function timeDistractors(h, m, fmt) {
  const correct = fmt(h, m);
  const add = (H, M) => [((H % 24) + 24) % 24, M];
  const quarters = [0, 15, 30, 45].filter((x) => x !== m);
  const near = [m + 5, m - 5, m + 10, m - 10].filter((x) => x > 0 && x < 60);
  const prio = [add(h + 1, m), add(h - 1, m)];
  const rest = shuffle([
    ...(m % 15 === 0 ? quarters : near).map((x) => add(h, x)),
    ...(m % 15 === 0 ? quarters : near).map((x) => add(h + 1, x)),
    add(h + 2, m), add(h - 2, m),
  ]);
  const out = new Set();
  for (const [H, M] of [...prio, ...rest]) {
    const s = fmt(H, M);
    if (s !== correct) out.add(s);
    if (out.size >= 3) break;
  }
  return [...out];
}

// type: cz (česky hovorově → FR), dig (digitálně 15:30 → FR), fr (FR → 15:30)
function buildTime(h, m, type) {
  const statId = "h|" + timeKind(m) + "|" + type;
  const key = "time|" + type + "|" + h + ":" + m;
  if (type === "fr") {
    const word = frTimeEveryday(h, m, true);
    const listen = state.sound && TTS_OK && Math.random() < 0.4;
    const q = {
      key, statId,
      prompt: listen ? "Poslouchej — kolik je hodin?" : "Kolik je hodin?",
      big: listen ? "🔊" : word, bigClass: listen ? "" : "sentence",
      sub: listen ? "klikni na 🔊 pro přehrání" : "",
      correct: fmtClock(h, m),
      audio: listen ? word : null,
      say: word,
      sayAfter: !listen && state.sound ? word : null,
    };
    if (state.ans === "text") {
      q.answerType = "text"; q.inputMode = "decimal"; q.sub = "napiš čas, např. 15:30";
      q.accepted = [fmtClock(h, m), h + "h" + pad2(m), h + "." + pad2(m), h + " " + pad2(m), h + "h" + (m ? pad2(m) : "")];
    } else {
      q.answerType = "choice";
      q.options = shuffle([q.correct, ...timeDistractors(h, m, fmtClock)]);
    }
    return q;
  }
  const official = type === "dig" && Math.random() < 0.3;
  const fmt = type === "cz" ? (H, M) => frTimeEveryday(H, M, false) : official ? frTimeOfficial : (H, M) => frTimeEveryday(H, M, true);
  const correct = fmt(h, m);
  const q = {
    key, statId,
    prompt: type === "cz" ? "Česky se řekne… a francouzsky?" : official ? "Úředně (nádraží, rádio):" : "Jak se to řekne francouzsky?",
    big: type === "cz" ? czTime(h, m) : fmtClock(h, m),
    bigClass: type === "cz" ? "sentence" : "",
    sub: type === "cz" ? "= " + fmtClock(h % 12 || 12, m) : "",
    correct,
    say: correct,
    sayAfter: state.sound ? correct : null,
  };
  if (state.ans === "text") {
    q.answerType = "text";
    q.accepted = [correct, frTimeEveryday(h, m, false), frTimeEveryday(h, m, true), frTimeOfficial(h, m),
      ...(type === "cz" ? [frTimeOfficial((h + 12) % 24, m), frTimeEveryday((h + 12) % 24, m, true)] : [])];
  } else {
    q.answerType = "choice";
    q.options = shuffle([correct, ...timeDistractors(h, m, fmt)]);
  }
  return q;
}

// náhodný čas daného druhu; cz jen pro čtvrthodiny (jinak se česky hovorově neříká)
function randTime(kind, type) {
  const k = kind || (Math.random() < 0.75 ? pick(["00", "15", "30", "30", "45", "45"]) : pick(["po", "pred"]));
  const m = k === "po" ? pick([5, 10, 20, 25]) : k === "pred" ? pick([35, 40, 50, 55]) : Number(k);
  const t = type || (m % 15 === 0 ? pick(["cz", "cz", "dig", "fr"]) : pick(["dig", "fr"]));
  const h = t === "cz" ? 1 + rnd(12) : rnd(24);
  return { h, m, type: t === "cz" && m % 15 ? "dig" : t };
}

function buildPcaux(pi) {
  const item = PCAUX[pi];
  const verb = VERBS.find((v) => v.inf === item.inf);
  const withEtre = verb.aux === "etre" && !item.avoirCOD;
  const pp = verb.pp;

  const eForm = (g) => ETRE[item.p] + " " + agree(pp, g);
  const aForm = (g) => AVOIR[item.p] + " " + agree(pp, g);
  const correct = withEtre ? eForm(item.g) : aForm("ms");

  // distraktory podle priority; „ms“ = tvar bez shody, proto se
  // některé varianty slévají — bereme první unikátní
  const others = ["ms", "fs", "mp", "fp"].filter((g) => g !== item.g);
  const wanted = withEtre
    ? [aForm(item.g), eForm(others[0]), aForm("ms"), eForm(others[1]), eForm(others[2]), aForm(others[0])]
    : [eForm("ms"), aForm(item.g === "ms" ? "fs" : item.g), eForm(item.g === "ms" ? "fs" : item.g), aForm("mp"), eForm("mp"), aForm("fp")];

  const seen = new Set([correct]);
  const opts = [correct];
  for (const c of wanted) {
    if (opts.length >= 4) break;
    if (seen.has(c)) continue;
    seen.add(c);
    opts.push(c);
  }
  // pojistka: doplň z všech kombinací, kdyby se něco slilo
  if (opts.length < 4) {
    for (const g of ["ms", "fs", "mp", "fp"]) {
      for (const f of [eForm(g), aForm(g)]) {
        if (opts.length >= 4) break;
        if (seen.has(f)) continue;
        seen.add(f);
        opts.push(f);
      }
    }
  }

  const houseNote = withEtre
    ? "„" + item.inf + "“ je v domečku → être" + (item.g !== "ms" ? " + shoda s podmětem (" + agree(pp, item.g) + ")" : "")
    : "„" + item.inf + "“ není v domečku → avoir, příčestí se nemění";

  return {
    key: "pa|" + pi, statId: "pa|" + pi,
    prompt: withEtre ? "🏠 Passé composé" : "Passé composé",
    big: item.s, bigClass: "sentence",
    sub: item.inf + " (" + verb.cz + ")",
    correct,
    answerType: "choice",
    options: shuffle(opts),
    why: item.why || houseNote,
    say: item.s.replace("___", correct),
    sayAfter: state.sound ? item.s.replace("___", correct) : null,
  };
}

function buildSwiss(si) {
  const s = SWISS[si];
  // distraktory: nejdřív ze stejné kategorie, pak odkudkoli;
  // deduplikace podle zobrazené hodnoty (různá slova mají někdy
  // stejný překlad — cornet i poche = „le sac“)
  const field = Math.random() < 0.6 ? "fr" : "ch";
  const pickDistractors = (val) => {
    const seen = new Set([val]);
    const out = [];
    for (const list of [SWISS.filter((x, i) => i !== si && x.cat === s.cat), SWISS.filter((x, i) => i !== si)]) {
      for (const x of shuffle(list)) {
        if (out.length >= 3) break;
        if (seen.has(x[field])) continue;
        seen.add(x[field]);
        out.push(x[field]);
      }
      if (out.length >= 3) break;
    }
    return out;
  };

  if (field === "fr") {
    return {
      key: "sw|" + si + "|f", statId: "sw|" + si,
      prompt: "🇨🇭 Co se ve Francii řekne jinak?",
      big: s.ch, bigClass: s.ch.length > 20 ? "sentence" : "",
      sub: s.cz + " · " + s.cat,
      correct: s.fr,
      answerType: "choice",
      options: shuffle([s.fr, ...pickDistractors(s.fr)]),
      why: s.note || null,
      say: s.fr,
      sayAfter: state.sound ? s.ch : null,
    };
  }
  return {
    key: "sw|" + si + "|c", statId: "sw|" + si,
    prompt: "Jak se to řekne ve Švýcarsku?",
    big: s.fr, bigClass: s.fr.length > 20 ? "sentence" : "",
    sub: s.cz + " · " + s.cat,
    correct: s.ch,
    answerType: "choice",
    options: shuffle([s.ch, ...pickDistractors(s.ch)]),
    why: s.note || null,
    say: s.ch,
    sayAfter: state.sound ? s.ch : null,
  };
}

function buildGen(noun) {

function buildSent(si) {

function buildGram(gi) {

// otázka z uloženého statId (fronty due/errs)
function questionFromStatId(id) {
  const p = id.split("|");
  if (p[0] === "c") {
    const verb = VERBS.find((v) => v.inf === p[1]);
    if (!verb || !TENSE_LABEL[p[2]]) return null;
    return buildConj(verb, p[2], rnd(6));
  }
  if (p[0] === "v") {
    const items = vocabItems();
    let item = items.find((x) => x.fr === p[1]);
    if (!item) {
      const verb = VERBS.find((v) => v.inf === p[1]);
      const voc = VOCAB.find((v) => v.fr === p[1]);
      item = verb ? { fr: verb.inf, cz: verb.cz, th: null } : voc ? { fr: voc.fr, cz: voc.cz, th: voc.th } : null;
    }
    if (!item) return null;
    const poolItems = items.length >= 4 ? items : vocabItems();
    return buildVocab(item, Math.random() < 0.5 ? "frcz" : "czfr", poolItems);
  }
  if (p[0] === "n") {
    const dec = Number(p[1]);
    const n = Math.min(100, dec + rnd(10));
    return buildNum(n);
  }
  if (p[0] === "h") {
    if (!TIME_KIND_LABEL[p[1]] || !TIME_TYPE_LABEL[p[2]]) return null;
    const t = randTime(p[1], p[2]);
    return buildTime(t.h, t.m, t.type);
  }
  if (p[0] === "g") {
    const noun = NOUNS.find((x) => x.n === p[1]);
    return noun ? buildGen(noun) : null;
  }
  if (p[0] === "pa") return PCAUX[Number(p[1])] ? buildPcaux(Number(p[1])) : null;
  if (p[0] === "sw") return SWISS[Number(p[1])] ? buildSwiss(Number(p[1])) : null;
  if (p[0] === "s") return SENTENCES[Number(p[1])] ? buildSent(Number(p[1])) : null;
  if (p[0] === "gr") return GRAMMAR[Number(p[1])] ? buildGram(Number(p[1])) : null;
  if (p[0] === "d") return DICT[Number(p[1])] ? buildDict(Number(p[1])) : null;
  return null;
}

function makeQuestion() {
  // fronty (opakování / moje chyby): otázky z uložených id
  if (state.mode === "due" || state.mode === "errs") {
    while (state.qi < state.queue.length) {
      const q = questionFromStatId(state.queue[state.qi]);
      if (q) return q;
      state.qi++; // nerozložitelné id (smazaná položka) přeskoč
    }
    return null;
  }

  const pool = getPool();
  const prevKey = state.q && state.q.key;
  const K = state.smart ? 6 : 1;

  for (let attempt = 0; attempt < 20; attempt++) {
    const mode = state.mode === "mix" ? pick(mixModes()) : state.mode;

    if (mode === "conj") {
      const cands = Array.from({ length: K }, () => ({
        verb: pick(pool), tense: pick(state.tenseIds), i: rnd(6),
      }));
      const c = sampleWeighted(cands, (x) => "c|" + x.verb.inf + "|" + x.tense);
      const q = buildConj(c.verb, c.tense, c.i);
      if (q.key === prevKey) continue;
      return q;
    }

    if (mode === "frcz" || mode === "czfr") {
      const items = vocabItems();
      const cands = Array.from({ length: K }, () => pick(items));
      const item = sampleWeighted(cands, (x) => "v|" + x.fr);
      const q = buildVocab(item, mode, items);
      if (q.key === prevKey) continue;
      return q;
    }

    if (mode === "sent") {
      const idxs = idxPool(SENTENCES, "s|");
      const cands = Array.from({ length: K }, () => pick(idxs));
      const si = sampleWeighted(cands, (i) => "s|" + i);
      if ("s|" + si === (prevKey || "")) continue;
      return buildSent(si);
    }

    if (mode === "gram") {
      // výběr témat platí jen v samotné Gramatice, Mix bere všechno
      const lvlI = (i) => lvlOk(GRAMMAR[i].lvl, "B1");
      const tp = state.mode === "gram" ? state.gramTopics : [];
      const inTp = (i) => lvlI(i) && tp.includes(GRAMMAR[i].topic);
      const useTp = tp.length && GRAMMAR.some((_, i) => inTp(i));
      const idxs = idxPool(GRAMMAR, "gr|", useTp ? inTp : lvlI);
      const cands = Array.from({ length: K }, () => pick(idxs));
      const gi = sampleWeighted(cands, (i) => "gr|" + i);
      const q = buildGram(gi);
      if (q.key === prevKey) continue;
      return q;
    }

    if (mode === "dict") {
      const idxs = idxPool(DICT, "d|", (i) => lvlOk(DICT[i].lvl, "B1"));
      const cands = Array.from({ length: K }, () => pick(idxs));
      const di = sampleWeighted(cands, (i) => "d|" + i);
      const q = buildDict(di);
      if (q.key === prevKey) continue;
      return q;
    }

    if (mode === "num") {
      const cands = Array.from({ length: K }, () => rnd(101));
      const n = sampleWeighted(cands, (x) => "n|" + Math.floor(x / 10) * 10);
      const listening = state.sound && TTS_OK && Math.random() < 0.5;
      const q = listening ? buildNumListen(n) : buildNum(n);
      if (q.key === prevKey) continue;
      return q;
    }

    if (mode === "pcaux") {
      // vyvážené střídání domeček / mimo domeček, ať je rozdíl vidět vedle sebe
      const inHouse = (i) => {
        const it = PCAUX[i];
        const v = VERBS.find((x) => x.inf === it.inf);
        return v.aux === "etre" && !it.avoirCOD;
      };
      const all = idxPool(PCAUX, "pa|");
      const wantHouse = Math.random() < 0.5;
      let side = all.filter((i) => inHouse(i) === wantHouse);
      if (!side.length) side = all;
      const cands = Array.from({ length: K }, () => pick(side));
      const pi = sampleWeighted(cands, (i) => "pa|" + i);
      const q = buildPcaux(pi);
      if (q.key === prevKey) continue;
      return q;
    }

    if (mode === "swiss") {
      const idxs = idxPool(SWISS, "sw|");
      const cands = Array.from({ length: K }, () => pick(idxs));
      const si = sampleWeighted(cands, (i) => "sw|" + i);
      const q = buildSwiss(si);
      if (q.key === prevKey) continue;
      return q;
    }

    if (mode === "pron") {
      const idxs = idxPool(PRON, "pr|", (i) => lvlOk(PRON[i].lvl, "B1"));
      const cands = Array.from({ length: K }, () => pick(idxs));
      const pi = sampleWeighted(cands, (i) => "pr|" + i);
      const q = buildPron(pi);
      if (q.key === prevKey) continue;
      return q;
    }

    if (mode === "pront") {
      const ex = pronExcerpts();
      const all = ex.map((_, i) => i).filter((i) => lvlOk(ex[i].lvl, "B1") && !isHidden("px|" + ex[i].ti + "|" + ex[i].si));
      const withNum = all.filter((i) => ex[i].num);
      const side = withNum.length && Math.random() < 0.6 ? withNum : all.length ? all : ex.map((_, i) => i);
      const cands = Array.from({ length: K }, () => pick(side));
      const k = sampleWeighted(cands, (i) => "px|" + ex[i].ti + "|" + ex[i].si);
      const q = buildPronText(k);
      if (q.key === prevKey) continue;
      return q;
    }

    if (mode === "time") {
      const cands = Array.from({ length: K }, () => randTime());
      const t = sampleWeighted(cands, (x) => "h|" + timeKind(x.m) + "|" + x.type);
      const q = buildTime(t.h, t.m, t.type);
      if (q.key === prevKey) continue;
      return q;
    }

    if (mode === "gen") {
      const nouns = nounPool();
      const cands = Array.from({ length: K }, () => pick(nouns));
      const noun = sampleWeighted(cands, (x) => "g|" + x.n);
      const q = buildGen(noun);
      if (q.key === prevKey) continue;
      return q;
    }

    if (mode === "cete") {
      const T = TEXTS[state.cteIdx];
      const qd = T.qs[state.cteQ];
      const vf = qd.o.length === 2 && qd.o[0] === "Vrai";
      return {
        key: "t|" + state.cteIdx + "|" + state.cteQ,
        statId: "t|" + state.cteIdx,
        prompt: "Otázka " + (state.cteQ + 1) + " / " + T.qs.length,
        big: qd.q, bigClass: "sentence",
        sub: "",
        correct: qd.c,
        say: qd.c,
        answerType: "choice",
        options: vf ? [...qd.o] : shuffle([...qd.o]),
        why: qd.why || null,
      };
    }
  }
  return null;
}

// výběr textu pro čtení (vážený chybovostí, bez okamžitého opakování)
function pickText() {
  let idxs = idxPool(TEXTS, "t|", (i) => lvlOk(TEXTS[i].level, "B1"));
  if (!idxs.length) idxs = TEXTS.map((_, i) => i);
  if (idxs.length > 1 && state.lastText !== null) {
    idxs = idxs.filter((i) => i !== state.lastText);
  }
  const cands = state.smart
    ? Array.from({ length: Math.min(6, idxs.length) }, () => pick(idxs))
    : [pick(idxs)];
  return sampleWeighted(cands, (i) => "t|" + i);
}

// věrohodné číselné distraktory (prohozené desítky/jednotky, ±1, ±10…)
function numDistractor(n) {
  const cand = [];
  const t = Math.floor(n / 10), u = n % 10;
  if (t !== u && u * 10 + t <= 100) cand.push(u * 10 + t); // 42 → 24
  if (n + 10 <= 100) cand.push(n + 10);
  if (n - 10 >= 0) cand.push(n - 10);
  if (n + 1 <= 100) cand.push(n + 1);
  if (n - 1 >= 0) cand.push(n - 1);
  if (n >= 60 && n <= 79) cand.push(n + 20 <= 100 ? n + 20 : n - 20); // 70 × 90
  if (n >= 80) cand.push(n - 20);
  const c = pick(cand);
  return c === n ? rnd(101) : c;
}

// ── Akce ────────────────────────────────────────────────────
function start(mode) {
  state.sheet = null;
  state.mode = mode;
  state.score = { ok: 0, total: 0, streak: 0 };
  if (mode === "due") {
    state.queue = shuffle(dueIds()).slice(0, 50);
    state.qi = 0;
  }
  if (mode === "errs") {
    state.queue = shuffle(errIds());
    state.qi = 0;
  }
  if (mode === "cete") {
    state.cteIdx = pickText();
    state.lastText = state.cteIdx;
    state.cteQ = 0;
  }
  state.q = null;
  state.q = makeQuestion();
  state.picked = null;
  state.accentWarn = false;
  state.houseOpen = false;
  pronReset();
  state.screen = "quiz";
  render();
  if (state.q && state.q.audio) speak(state.q.audio);
}

function applyAnswer(ok, displayPicked) {
  state.picked = displayPicked;
  state.stamp = ok ? pick(PRAISE) : pick(OOPS);
  state.score.ok += ok ? 1 : 0;
  state.score.total += 1;
  state.score.streak = ok ? state.score.streak + 1 : 0;
  recStat(state.q.statId, ok);
  render();
  if (state.q.sayAfter) speak(state.q.sayAfter);
}

function answerChoice(opt) {
  if (state.picked !== null) return;
  applyAnswer(opt === state.q.correct, opt);
}

// diktát: tokenizace a porovnání po slovech
const dictTok = (s) =>
  String(s).toLowerCase().replace(/[’']/g, "").replace(/[.,!?;:«»"()\-—…]/g, " ").split(/\s+/).filter(Boolean);
function dictEval(input, target) {
  const exp = dictTok(target);
  const got = dictTok(input);
  const marks = exp.map((w, i) => {
    if (got[i] === w) return 2;
    if (got[i] && stripAcc(got[i]) === stripAcc(w)) return 1;
    return 0;
  });
  let ok = got.length === exp.length && marks.every((m) => m > 0);
  let accentWarn = ok && marks.some((m) => m === 1);
  // fallback: apostrofy psané mezerou (m appelle, aujourd hui) — porovnej slepené
  if (!ok) {
    const sq = (x) => dictTok(x).join("");
    if (sq(input) === sq(target)) {
      ok = true;
      for (let i = 0; i < marks.length; i++) marks[i] = 2;
    } else if (stripAcc(sq(input)) === stripAcc(sq(target))) {
      ok = true; accentWarn = true;
      for (let i = 0; i < marks.length; i++) marks[i] = 2;
    }
  }
  return { marks, ok, accentWarn };
}

// ── Výslovnost (🎤): rozpoznávání řeči + souběžná nahrávka ───────────
// Web Speech API (iOS Safari: webkitSpeechRecognition). Safari často skončí
// BEZ isFinal → vyhodnocuje se poslední průběžný přepis. continuous + vlastní
// stop po 2,5 s ticha / 20 s / tlačítkem; pojistka, kdyby nepřišlo onend.
// Zvuk zpracovává výrobce prohlížeče (Apple/Google) — viz Nápověda.
const SR_CLASS = window.SpeechRecognition || window.webkitSpeechRecognition;
const SR_OK = !!SR_CLASS;
const REC_OK = "MediaRecorder" in window && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
let prRec = null;   // běžící rozpoznávání: { stop }
let prMedia = null; // běžící nahrávání: { m, st }

// slova, která znějí stejně a liší se jen pravopisem (rozpoznávač si vybírá sám)
const PR_HOMO = { "à": "a", "où": "ou", "est": "et", "ces": "ses", "ce": "se", "sont": "son", "verre": "ver", "vert": "ver", "vers": "ver" };
function prKey(w) {
  let k = PR_HOMO[w] || w;
  k = stripAcc(k);
  if (k.length > 5 && /ent$/.test(k)) k = k.slice(0, -2); // parlent → parle
  return k.replace(/[sxtd]+$/, "") || k;                // parles/parlez… → parle
}
// čísla → francouzská slova (obě strany stejnou funkcí: v textu „10 h“,
// rozpoznávač napíše „10h“ nebo „dix heures“ → vše skončí jako „dix heures“)
function frNumBig(n) {
  if (n <= 100) return frNumber(n);
  if (n < 1000) {
    const h = Math.floor(n / 100), r = n % 100;
    return (h > 1 ? frNumber(h) + " cent" : "cent") + (r ? " " + frNumber(r) : h > 1 ? "s" : "");
  }
  if (n < 1000000) {
    const t = Math.floor(n / 1000), r = n % 1000;
    return (t > 1 ? frNumBig(t) + " mille" : "mille") + (r ? " " + frNumBig(r) : "");
  }
  return String(n);
}
// sjednocení zápisu (celý řetězec, kvůli mezerám): 18 h 30 → 18h30, 2 € → 2€
const prNormStr = (s) => String(s)
  .replace(/(\d)\s*h\s*(\d{2})\b/gi, "$1h$2").replace(/(\d)\s+h\b/gi, "$1h")
  .replace(/(\d)\s+(€|%)/g, "$1$2");
// tokeny jednoho slova; „06“ = zéro six (telefon), 1er = premier
function prWordToks(w) {
  const x = w
    .replace(/\b1(er|re)\b/gi, " premier ")
    .replace(/(\d)h(\d{2})/gi, "$1 heures $2").replace(/(\d)h\b/gi, "$1 heures")
    .replace(/€/g, " euros ").replace(/%/g, " pour cent ").replace(/\bCHF\b/g, " francs ");
  return dictTok(x).flatMap((t) => {
    if (!/^\d+$/.test(t)) return [t];
    const z = t.length > 1 && t[0] === "0" ? ["zéro"] : [];
    return z.concat(dictTok(frNumBig(Number(t))));
  });
}
// cíl po slovech: { toks: [klíče], name } — jméno (velké písmeno uprostřed věty)
// se u dlouhých textů nehodnotí, rozpoznávač jména píše po svém
function prTargetWords(target, long) {
  const ws = prNormStr(target).split(/\s+/).filter(Boolean);
  return ws.map((w, i) => ({
    w,
    toks: prWordToks(w).map(prKey),
    name: !!long && i > 0 && !/[.!?]["»”]?$/.test(ws[i - 1]) && /^[A-ZÀ-ÝŒ]/.test(w) && !/\d/.test(w),
  }));
}
// LCS po tokenech: značka 2 = zaznělo, 0 = chybí / jiné, 3 = jméno (nehodnotí se)
// krátké věty: správně = všechno; dlouhý text: správně = aspoň 90 % slov
function pronEval(heard, target, long) {
  const tw = prTargetWords(target, long);
  const a = tw.flatMap((x) => x.toks), isName = tw.flatMap((x) => x.toks.map(() => x.name));
  const b = prNormStr(heard).split(/\s+/).filter(Boolean).flatMap(prWordToks).map(prKey);
  const L = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const marks = [];
  let i = 0, j = 0;
  while (i < a.length) {
    if (j < b.length && a[i] === b[j]) { marks.push(2); i++; j++; }
    else if (j < b.length && L[i][j + 1] > L[i + 1][j]) j++;
    else { marks.push(0); i++; }
  }
  isName.forEach((n, k) => { if (n) marks[k] = 3; });
  const graded = marks.filter((m) => m !== 3);
  const hit = graded.filter((m) => m === 2).length;
  const score = graded.length ? hit / graded.length : 0;
  return { marks, score, ok: long ? score >= 0.9 : hit === graded.length };
}

// úryvky z DELF textů pro 🎤 Text: souvislé 2–3 věty (18–55 slov), bez uvozovek,
// závorek a zkratek. Deterministické z TEXTS (append-only) → id px|text|věta stabilní.
let PRON_EX_CACHE = null;
function pronExcerpts() {
  if (PRON_EX_CACHE) return PRON_EX_CACHE;
  const out = [];
  const wc = (x) => x.split(" ").length;
  TEXTS.forEach((T, ti) => {
    const S = (T.text.replace(/\s+/g, " ").match(/[^.!?]+(?:[.!?]+["»”]?|$)/g) || []).map((x) => x.trim()).filter(Boolean);
    let i = 0;
    while (i < S.length) {
      let j = i, w = 0;
      while (j < S.length && w < 22) { w += wc(S[j]); j++; }
      const txt = S.slice(i, j).join(" ");
      if (w >= 18 && w <= 55 && !/[«»"“”;()]|\b(M|Mme|Dr|av|J\.-C)\./.test(txt))
        out.push({ ti, si: i, lvl: T.level, s: txt, num: /\d/.test(txt) });
      i = j;
    }
  });
  return (PRON_EX_CACHE = out);
}

function prRecordStart(onUrl) {
  if (!REC_OK) return;
  navigator.mediaDevices.getUserMedia({ audio: true }).then((st) => {
    const ch = [];
    const m = new MediaRecorder(st);
    prMedia = { m, st };
    m.ondataavailable = (e) => e.data.size && ch.push(e.data);
    m.onstop = () => {
      st.getTracks().forEach((t) => t.stop());
      const blob = new Blob(ch, { type: m.mimeType || "audio/mp4" });
      if (blob.size > 1000) onUrl(URL.createObjectURL(blob));
    };
    m.start();
  }).catch(() => {});
}
function prRecordStop() {
  if (prMedia && prMedia.m.state === "recording") prMedia.m.stop();
  prMedia = null;
}
// při odchodu z otázky (další / konec / menu) všechno zastav
function pronReset() {
  if (prRec) prRec.stop();
  prRecordStop();
  if (state.pr && state.pr.recUrl) URL.revokeObjectURL(state.pr.recUrl);
  state.pr = null;
}

// opakované pokusy: statistiky/SRS počítají jen PRVNÍ pokus (ať opakování ví,
// co dělá potíže); oprava napodruhé se ale započítá do skóre kola jako správně
const prCarry = () => {
  const o = state.pr || {};
  return { tries: o.tries || 0, everOk: !!o.everOk };
};
function pronAnswer(ok, shown) {
  const p = state.pr;
  if (!p.tries) {
    p.everOk = ok;
    applyAnswer(ok, shown);
    return;
  }
  state.picked = shown;
  if (ok && !p.everOk) {
    p.everOk = true;
    state.score.ok += 1;
    state.stamp = "Tentokrát ano !";
  } else {
    state.stamp = ok ? pick(PRAISE) : pick(OOPS);
  }
  render();
}
function pronRetry() {
  const o = state.pr || {};
  if (o.recUrl) URL.revokeObjectURL(o.recUrl);
  state.pr = { phase: "idle", tries: (o.tries || 0) + 1, everOk: !!o.everOk };
  state.picked = null;
  state.dictMarks = null;
  render();
}

function pronStart() {
  const q = state.q;
  const p = (state.pr = { phase: "listening", live: "", ...prCarry() });
  render();
  const rec = new SR_CLASS();
  rec.lang = "fr-FR";
  rec.interimResults = true;
  rec.continuous = true;
  let last = "", ended = false, silence = null;
  const hard = setTimeout(() => stop(), q.long ? 60000 : 20000);
  const joinResults = (res) => {
    const t = Array.from(res).map((x) => x[0].transcript.trim()).filter(Boolean);
    const n = (x) => dictTok(x).join(" ");
    const cumulative = t.length > 1 && t.every((x, k) => k === 0 || n(x).startsWith(n(t[k - 1])));
    return cumulative ? t[t.length - 1] : t.join(" ");
  };
  function stop() {
    if (ended) return;
    clearTimeout(silence); clearTimeout(hard);
    try { rec.stop(); } catch {}
    setTimeout(finish, 1500); // Safari občas onend nepošle
  }
  function finish() {
    if (ended) return;
    ended = true;
    clearTimeout(silence); clearTimeout(hard);
    prRec = null;
    prRecordStop();
    if (state.q !== q || state.pr !== p) return; // mezitím odešla jinam
    if (!last) {
      p.phase = "idle";
      p.err = p.err || "Nic jsem nezachytil, zkus to znovu (mluv kousek blíž k telefonu).";
      render();
      return;
    }
    const r = pronEval(last, q.correct, q.long);
    state.dictMarks = r.marks;
    Object.assign(p, { phase: "done", heard: last, score: r.score, ok: r.ok });
    pronAnswer(r.ok, last);
  }
  prRec = { stop };
  rec.onresult = (e) => {
    last = joinResults(e.results);
    p.live = last;
    const el = document.getElementById("prLive");
    if (el) el.textContent = last;
    clearTimeout(silence);
    silence = setTimeout(stop, q.long ? 4000 : 2500);
  };
  rec.onerror = (e) => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed")
      p.err = "Mikrofon nebo rozpoznávání řeči není povolené. Na iPhonu: povol mikrofon pro Safari a zapni Diktování (Nastavení → Obecné → Klávesnice). Případně vypni 🎤 rozpoznávání v Nastavení — pak se jen nahráváš a posoudíš to sama.";
    else if (e.error !== "no-speech" && e.error !== "aborted") p.err = "Chyba rozpoznávání: " + e.error;
  };
  rec.onend = finish;
  try { rec.start(); } catch { p.phase = "idle"; p.err = "Rozpoznávání se nepodařilo spustit."; render(); return; }
  prRecordStart((url) => {
    if (state.pr !== p) return URL.revokeObjectURL(url);
    p.recUrl = url;
    if (state.picked !== null) render();
  });
}

// bez rozpoznávání: jen nahrát, poslechnout a ohodnotit se sama
function pronRecStart() {
  const q = state.q;
  const p = (state.pr = { phase: "recording", ...prCarry() });
  render();
  prRecordStart((url) => {
    if (state.q !== q || state.pr !== p) return URL.revokeObjectURL(url);
    p.recUrl = url;
    p.phase = "recorded";
    render();
  });
}

function renderPronResult(q) {
  const p = state.pr || {};
  let h = "";
  if (p.self) {
    h += '<div class="typedAnswer">' + esc(q.correct) + "</div>";
  } else {
    let ti = 0;
    const mk = state.dictMarks || [];
    h += '<div class="typedAnswer dictDiff' + (q.long ? " long" : "") + '">' + prTargetWords(q.correct, q.long).map((x) => {
      const ms = x.toks.map(() => mk[ti++]);
      const cls = !x.toks.length || ms.every((m) => m === 2) ? "good" : ms.every((m) => m === 3) ? "name" : "bad";
      return '<span class="dw ' + cls + '">' + esc(x.w) + "</span>";
    }).join(" ") + "</div>";
    h += '<div class="dictYours">slyšel jsem: „' + esc(p.heard || "") + "“ · " + Math.round((p.score || 0) * 100) + " % slov" +
      (q.long ? " (stačí 90 %" + (prTargetWords(q.correct, true).some((x) => x.name) ? ", jména šedě se nehodnotí" : "") + ")" : "") + "</div>";
  }
  if (p.recUrl) h += '<span class="label" style="display:block;margin-top:12px">Tvoje nahrávka</span><audio controls class="prAudio" src="' + p.recUrl + '"></audio>';
  return h;
}
function answerTyped(text) {
  if (state.picked !== null || !text.trim()) return;
  if (state.q.dict) {
    const r = dictEval(text, state.q.correct);
    state.dictMarks = r.marks;
    state.accentWarn = r.accentWarn;
    applyAnswer(r.ok, text.trim());
    return;
  }
  const m = matchTyped(text, state.q.accepted);
  state.accentWarn = m === 1;
  applyAnswer(m > 0, text.trim());
}

function next() {
  if (state.mode === "due" || state.mode === "errs") {
    state.qi++;
    if (state.qi >= state.queue.length) { finish(); return; }
    state.q = makeQuestion();
    state.picked = null;
    state.accentWarn = false;
    state.houseOpen = false;
  pronReset();
    if (!state.q) { finish(); return; }
    render();
    if (state.q.audio) speak(state.q.audio);
    return;
  }
  if (state.mode === "cete") {
    if (state.cteQ >= TEXTS[state.cteIdx].qs.length - 1) {
      finish();
      return;
    }
    state.cteQ++;
  } else if (state.sessionLen > 0 && state.score.total >= state.sessionLen) {
    finish();
    return;
  }
  state.q = makeQuestion();
  state.picked = null;
  state.accentWarn = false;
  state.houseOpen = false;
  pronReset();
  render();
  if (state.q && state.q.audio) speak(state.q.audio);
}

function finish() {
  pronReset();
  if (state.score.total > 0) {
    const entry = {
      d: Date.now(), m: state.mode, g: state.grp,
      ok: state.score.ok, t: state.score.total,
    };
    state.history = [entry, ...state.history].slice(0, 30);
    saveJSON(HIST_KEY, state.history);
    state.screen = "done";
  } else {
    state.screen = "menu";
  }
  render();
}

function toggleTense(id) {
  const cur = state.tenseIds;
  if (cur.includes(id)) {
    if (cur.length > 1) state.tenseIds = cur.filter((t) => t !== id);
  } else {
    state.tenseIds = [...cur, id];
  }
  saveSettings();
  render();
}

    '<button class="icoBtn" data-action="show-settings" aria-label="Nastavení">⚙️</button></div>' +
    '<p class="ver">v' + APP_VERSION + "</p>";

  const sec = [];
  if (nDue > 0) sec.push('<button class="secondary" data-action="start" data-id="due">📅 Zopakovat <span class="n">' + nDue + "</span></button>");
  if (nErr > 0) sec.push('<button class="secondary" data-action="start" data-id="errs">🔁 Chyby <span class="n">' + nErr + "</span></button>");
  html += '<div class="card">' +
    '<div class="streakLine">🔥 Série <b>' + si.streak + "</b> " + (si.streak === 1 ? "den" : si.streak >= 2 && si.streak <= 4 ? "dny" : "dní") +
    " · dnes <b>" + si.today + "</b> / " + state.goal + "</div>" +
    '<div class="hm">' + Array.from({ length: 28 }, (_, i) => {
      const c = state.days[todayKey(27 - i)] || 0;
      return '<span class="hmd' + (c >= state.goal ? " g" : c > 0 ? " p" : "") + '"></span>';
    }).join("") + "</div>" +
    '<div class="todayBtns">' +
    '<button class="primary" data-action="start" data-id="mix">▶ Mix<small>časování, slovíčka, gramatika, čísla, rody' + (a2 ? ", věty" : "") + "</small></button>" +
    sec.join("") + "</div></div>";

  const group = (label, tiles) => '<div class="group"><span class="label">' + label + '</span><div class="tiles">' + tiles + "</div></div>";
  html += group("Slovesa",
    tile("conj", "Časování", "nous prenons", true) +
    (a2 ? tile("pcaux", "être × avoir", "🏠 domeček") + tile("sent", "PC × imparfait", "il pleuvait") : ""));
  html += group("Gramatika",
    tile("gram", "Gramatika", "au, du, dont…", true) +
    tile("gen", "Rody", "un problème"));
  html += group("Slovíčka",
    tile("vocab", "Slovíčka", state.vocabDir === "czfr" ? "CZ → FR" : "FR → CZ", true) +
    tile("num", "Čísla", numWord(72)) +
    tile("time", "🕐 Hodiny", "půl čtvrté = 3:30") +
    tile("swiss", "🇨🇭 Romandie", "natel, cornet"));
  html += group("Poslech a čtení",
    (TTS_OK ? tile("dict", "Diktát", "🔊 dictée") : "") +
    (SR_OK || REC_OK ? tile("pron", "🎤 Věty nahlas", "sous × sur") + tile("pront", "🎤 Text nahlas", "à 19 h 30") : "") +
    tile("cete", "Čtení DELF", TEXTS.filter((t) => lvlOk(t.level, "B1")).length + " textů"));

  if (state.sheet) html += '<div class="scrim" data-action="close-sheet"></div><div class="sheet" role="dialog" aria-modal="true"><div class="sheetIn">' + renderSheet() + "</div></div>";
  return html;
}

function vocabThemesAtLevel() {
  const cnt = {};
  VOCAB.forEach((v) => { if (lvlOk(v.lvl, "A2")) cnt[v.th] = (cnt[v.th] || 0) + 1; });
  return Object.entries(cnt).sort((a, b) => a[0].localeCompare(b[0], "cs"));
}

// témata gramatiky dostupná na aktuální úrovni: [[topic, počet], …] od nejpočetnějšího
function gramTopicsAtLevel() {
  const cnt = {};
  GRAMMAR.forEach((g) => { if (lvlOk(g.lvl, "B1")) cnt[g.topic] = (cnt[g.topic] || 0) + 1; });
  return Object.entries(cnt).sort((a, b) => b[1] - a[1]);
}

function renderSheet() {
  const head = (title, sub) => '<div class="grab"></div><h2 class="sheetTitle">' + title + "</h2>" + (sub ? '<p class="sheetSub">' + sub + "</p>" : "");
  const field = (label, body) => '<div class="field"><span class="label">' + label + "</span>" + body + "</div>";
  const go = (mode) => '<button class="nextBtn" data-action="start" data-id="' + mode + '">Začít</button>';
  if (state.sheet === "level") {
    return head("Úroveň", "Filtruje obsah ve všech cvičeních a přednastaví časy.") +
      chipRow(LEVELS.map((l) => ({ id: l, label: l })), (l) => state.level === l.id, "level");
  }
  if (state.sheet === "conj") {
    return head("Časování", "nous + prendre → nous prenons") +
      field("Slovesa (" + getPool().length + ")", chipRow(
        [{ id: "all", label: "Všechna" }, { id: "irr", label: "Nepravidelná" }, { id: "reg", label: "Pravidelná" }],
        (g) => state.grp === g.id, "grp")) +
      field("Časy", chipRow(TENSES.filter((t) => LVL[t.lvl] <= LVL[state.level]), (t) => state.tenseIds.includes(t.id), "tense")) +
      go("conj");
  }
  if (state.sheet === "vocab") {
    return head("Slovíčka", "překlad oběma směry") +
      field("Směr", chipRow([{ id: "frcz", label: "FR → CZ" }, { id: "czfr", label: "CZ → FR" }], (d) => state.vocabDir === d.id, "vocab-dir")) +
      field("Zdroj", chipRow(
        [{ id: "all", label: "Vše" }, { id: "verbs", label: "Jen slovesa" }, { id: "themes", label: "Jen témata" }],
        (v) => state.vocabSrc === v.id, "vocab-src")) +
      (state.vocabSrc === "themes" ? field("Témata", chipRow([{ id: "*", label: "Všechna" }].concat(vocabThemesAtLevel().map(([t, n]) => ({ id: t, label: t + " · " + n }))),
        (t) => (t.id === "*" ? !state.vocabThemes.length : state.vocabThemes.includes(t.id)), "vocab-theme")) : "") +
      go(state.vocabDir);
  }
  if (state.sheet === "gram") {
    const topics = gramTopicsAtLevel().map(([t, n]) => ({ id: t, label: t + " · " + n }));
    return head("Gramatika", "doplň do věty") +
      field("Témata", chipRow([{ id: "*", label: "Vše" }].concat(topics),
        (t) => (t.id === "*" ? !state.gramTopics.length : state.gramTopics.includes(t.id)), "gram-topic")) +
      go("gram");
  }
  return "";
}

function renderQuiz() {
  const s = state.score;
  const q = state.q;
  const isCete = state.mode === "cete";
  let progress = "";
  if (state.mode === "due" || state.mode === "errs") {
    progress = Math.min(state.qi + 1, state.queue.length) + " / " + state.queue.length + " · ";
  } else if (isCete) {
    progress = Math.min(state.cteQ + 1, TEXTS[state.cteIdx].qs.length) + " / " + TEXTS[state.cteIdx].qs.length + " · ";
  } else if (state.sessionLen > 0) {
    const cur = Math.min(s.total + (state.picked === null ? 1 : 0), state.sessionLen);
    progress = cur + " / " + state.sessionLen + " · ";
  }
  let html =
    '<div class="topbar">' +
    '<button class="back" data-action="finish">' + (s.total > 0 ? "← ukončit" : "← menu") + "</button>" +
    '<div class="scorebox">' + progress + "<b>" + s.ok + "</b> správně" +
    (s.streak >= 3 ? ' · <span class="streak">🔥 ' + s.streak + "</span>" : "") +
    "</div></div>";

  if (isCete) {
    const T = TEXTS[state.cteIdx];
    html += '<div class="card textCard">' +
      '<div class="labelRow"><span class="label">' + esc(T.title) + " · " + esc(T.level) + "</span>" +
      (state.sound && TTS_OK ? '<button class="histClear" data-action="read-text">🔊 přečíst</button>' : "") +
      "</div>" +
      '<p class="readText">' + esc(T.text) + "</p></div>";
  }

  html += '<div class="card">' +
    '<p class="qPrompt">' + esc(q.prompt) + "</p>" +
    '<p class="qBig' + (q.bigClass ? " " + q.bigClass : "") + '">' + esc(q.big) + "</p>" +
    (q.sub ? '<p class="qSub">' + esc(q.sub) + "</p>" : "");

  if (q.audio) {
    html += '<button class="speakBtn" data-action="replay" aria-label="Přehrát znovu">🔊</button>';
  }

  if (q.answerType === "choice") {
    q.options.forEach((opt, idx) => {
      let cls = "opt";
      if (state.picked !== null) {
        if (opt === q.correct) cls += " good";
        else if (opt === state.picked) cls += " bad";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" data-action="answer" data-id="' + idx + '"' +
        (state.picked !== null ? " disabled" : "") + ">" + esc(opt) + "</button>";
    });
  } else if (q.pron) {
    html += state.picked === null ? renderPronControls() : renderPronResult(q);
  } else if (state.picked === null) {
    html += '<div class="typeRow">' +
      (q.prefix ? '<span class="typePrefix' + (q.prefixElided ? " elided" : "") + '">' + esc(q.prefix) + "</span>" : "") +
      '<input class="typeInput" id="typeInput" autocomplete="off" autocapitalize="off" spellcheck="false"' +
      (q.inputMode ? ' inputmode="' + q.inputMode + '"' : "") + ">" +
      '<button class="typeOk" data-action="submit-typed">OK</button></div>';
  } else if (q.dict) {
    // diktát: očekávaná věta se značkami po slovech + co napsala
    const expWords = q.correct.split(/\s+/);
    const toks = dictTok(q.correct);
    let ti = 0;
    html += '<div class="typedAnswer dictDiff">' + expWords.map((w) => {
      const hasTok = dictTok(w).length > 0;
      const m = hasTok ? (state.dictMarks || [])[ti++] : 2;
      const cls = m === 2 ? "dw good" : m === 1 ? "dw acc" : "dw bad";
      return '<span class="' + cls + '">' + esc(w) + "</span>";
    }).join(" ") + "</div>";
    html += '<div class="dictYours">napsáno: ' + esc(state.picked) + "</div>";
  } else {
    const ok = state.accentWarn || matchTyped(state.picked, q.accepted) > 0;
    html += '<div class="typedAnswer">' +
      (q.prefix ? esc(q.prefix) + (q.prefixElided ? "" : " ") : "") +
      (ok ? "<b>" + esc(state.picked) + "</b>" : '<span class="wrong">' + esc(state.picked) + "</span>") +
      "</div>";
  }

  // 🏠 domeček jako rozbalovací nápověda pod možnostmi
  // (podle typu otázky, ne režimu — funguje i v Mixu a ve frontách)
  if (/^pa\|/.test(q.statId || "")) {
    const inf = (PCAUX[Number((q.statId || "").split("|")[1])] || {}).inf || "";
    html += '<button class="houseLink' + (state.houseOpen ? " open" : "") + '" data-action="toggle-house">' +
      (state.houseOpen ? "🏠 skrýt domeček ▲" : "🏠 domeček slovesa être ▼") + "</button>";
    if (state.houseOpen) {
      const inHouse = HOUSE_SET.has(inf);
      let note = "";
      if (inf && state.houseHl) {
        note = inHouse
          ? '<p class="houseNote ok">🏠 <b>' + esc(inf) + "</b> je v domečku → <b>être</b> (příčestí se shoduje s podmětem).</p>"
          : '<p class="houseNote no"><b>' + esc(inf) + "</b> v domečku <b>není</b> → <b>avoir</b> (příčestí se nemění).</p>";
      }
      html += '<div class="housePanel">' + houseSVG(inf) +
        '<div class="houseCtl">' +
        chipRow([{ id: "on", label: "Zvýraznit sloveso" }, { id: "off", label: "Jen domeček" }],
          (o) => (o.id === "on") === !!state.houseHl, "house-hl") +
        note +
        '<p class="houseTip">Shoda u être: <i>il est allé</i> · <i>elle est allée</i> · <i>ils sont allés</i> · <i>elles sont allées</i>.</p>' +
        '<p class="houseTip"><b>monter, descendre, sortir, passer, retourner</b> jsou v domečku, ale s přímým předmětem jdou s <b>avoir</b>: <i>je suis sorti</i> × <i>j\'ai sorti le chien</i>.</p>' +
        "</div></div>";
    }
  }

  if (state.picked !== null) {
    const ok = q.answerType === "choice"
      ? state.picked === q.correct
      : q.pron
        ? !!(state.pr && state.pr.ok)
        : q.dict
        ? dictEval(state.picked, q.correct).ok
        : matchTyped(state.picked, q.accepted) > 0;
    html += '<div class="stampRow"><div class="stamp ' + (ok ? "ok" : "ko") + '">' + esc(state.stamp) + "</div>" +
      (TTS_OK && q.say ? '<button class="sayBtn" data-action="say-answer" aria-label="Přehrát správnou odpověď">🔊 přehrát</button>' : "") +
      "</div>";
    if (state.accentWarn) {
      html += '<p class="accentNote">Pozor na akcenty' + (q.dict ? "" : ": " + esc(q.correct)) + "</p>";
    } else if (!ok && !q.dict && !q.pron) {
      html += '<p class="correction">→ ' + esc(q.correct) + "</p>";
    }
    if (q.why) html += '<p class="why">' + esc(q.why) + "</p>";
    if (/^(s|gr|d|sw|pa|pr|px)\|/.test(q.statId || "")) {
      html += '<button class="hideLink" data-action="hide-item" data-id="' + esc(q.statId) + '">🚫 tuhle položku už nedávat</button>';
    }
    const last = state.mode === "cete"
      ? state.cteQ >= TEXTS[state.cteIdx].qs.length - 1
      : state.mode === "due" || state.mode === "errs"
        ? state.qi >= state.queue.length - 1
        : state.sessionLen > 0 && s.total >= state.sessionLen;
    if (q.pron) html += '<button class="secondary prRetry" data-action="pron-retry">🔁 zkusit znovu</button>';
    html += '<button class="nextBtn" data-action="next">' + (last ? "Výsledek →" : "Další →") + "</button>";
  }
  html += "</div>";
  return html;
}

// popisek úryvku 🎤 Text: „začátek…“ (název textu)
function pxLabel(k) {
  const [ti, si] = k.split("|").map(Number);
  const e = pronExcerpts().find((x) => x.ti === ti && x.si === si);
  if (!e) return "úryvek " + k;
  return e.s.split(" ").slice(0, 7).join(" ") + "… (" + TEXTS[ti].title + ")";
}

// ── Statistiky ──────────────────────────────────────────────
function aggStats(prefix) {
  // vrátí mapu klíč(bez prefixu) → {o,b}
  const out = {};
  for (const [id, s] of Object.entries(state.stats)) {
    if (!id.startsWith(prefix)) continue;
    out[id.slice(prefix.length)] = { o: (out[id.slice(prefix.length)]?.o || 0) + s.o, b: (out[id.slice(prefix.length)]?.b || 0) + s.b };
  }
  return out;
}
function statRows(entries, nameFn, max, delSpec) {
  const rows = entries
    .map(([k, s]) => ({ k, ...s, n: s.o + s.b, r: s.b / (s.o + s.b) }))
    .filter((x) => x.b > 0)
    .sort((a, b) => b.r - a.r || b.b - a.b)
    .slice(0, max);
  if (!rows.length) return '<p class="statEmpty">Zatím žádné chyby. 🎉</p>';
  return rows.map((x) =>
    '<div class="statRow"><span class="statName">' + nameFn(x.k) + "</span>" +
    '<span class="statVal' + (x.r >= 0.4 ? " lo" : "") + '">' + x.b + "× chyba z " + x.n + " (" + Math.round(100 * (1 - x.r)) + " % úspěšnost)" +
    (delSpec ? ' <button class="knowBtn" data-action="mark-known" data-id="' + esc(delSpec(x.k)) + '" title="Vynulovat — tohle už umím">✓ umím</button>' : "") +
    "</span></div>"
  ).join("");
}
function renderStats() {
  let html = '<div class="topbar"><button class="back" data-action="menu">← menu</button></div>';
  html += '<h1 class="title">Statistiky chyb</h1><p class="subtitle">počítá se všechno napříč sessions (jen v tomhle zařízení)</p>';
  html += renderHistory();

  // slovesa: agregace c|inf|tense → per sloveso
  const byVerbTense = aggStats("c|");
  const byVerb = {};
  const byTense = {};
  for (const [k, s] of Object.entries(byVerbTense)) {
    const [inf, tense] = k.split("|");
    byVerb[inf] = { o: (byVerb[inf]?.o || 0) + s.o, b: (byVerb[inf]?.b || 0) + s.b };
    byTense[tense] = { o: (byTense[tense]?.o || 0) + s.o, b: (byTense[tense]?.b || 0) + s.b };
  }
  html += '<div class="card"><span class="label">Nejtěžší slovesa (časování)</span>' +
    statRows(Object.entries(byVerb), (k) => esc(k), 8, (k) => "c|" + k + "|") + "</div>";
  html += '<div class="card"><span class="label">Podle času</span>' +
    statRows(Object.entries(byTense), (k) => esc(TENSE_LABEL[k] || k), 7, null) + "</div>";
  html += '<div class="card"><span class="label">Slovíčka</span>' +
    statRows(Object.entries(aggStats("v|")), (k) => esc(k), 8, (k) => "v|" + k) + "</div>";
  html += '<div class="card"><span class="label">Čísla (podle desítek)</span>' +
    statRows(Object.entries(aggStats("n|")), (k) => esc(k) + "–" + (Number(k) + 9 > 100 ? 100 : Number(k) + 9), 5, (k) => "n|" + k) + "</div>";
  html += '<div class="card"><span class="label">Hodiny</span>' +
    statRows(Object.entries(aggStats("h|")), (k) => {
      const [kd, ty] = k.split("|");
      return esc((TIME_KIND_LABEL[kd] || kd) + " · " + (TIME_TYPE_LABEL[ty] || ty));
    }, 6, (k) => "h|" + k) + "</div>";
  html += '<div class="card"><span class="label">Rody</span>' +
    statRows(Object.entries(aggStats("g|")), (k) => esc(k), 8, (k) => "g|" + k) + "</div>";
  html += '<div class="card"><span class="label">PC × imparfait (věty)</span>' +
    statRows(Object.entries(aggStats("s|")), (k) => esc((SENTENCES[Number(k)] || {}).s || "věta " + k), 5, (k) => "s|" + k) + "</div>";
  html += '<div class="card"><span class="label">Passé composé: être × avoir</span>' +
    statRows(Object.entries(aggStats("pa|")), (k) => esc((PCAUX[Number(k)] || {}).s || "věta " + k), 8, (k) => "pa|" + k) + "</div>";
  html += '<div class="card"><span class="label">Švýcarská francouzština</span>' +
    statRows(Object.entries(aggStats("sw|")), (k) => esc((SWISS[Number(k)] || {}).ch || "položka " + k), 8, (k) => "sw|" + k) + "</div>";
  html += '<div class="card"><span class="label">Gramatika</span>' +
    statRows(Object.entries(aggStats("gr|")), (k) => esc((GRAMMAR[Number(k)] || {}).s || "položka " + k), 8, (k) => "gr|" + k) + "</div>";
  html += '<div class="card"><span class="label">Diktáty</span>' +
    statRows(Object.entries(aggStats("d|")), (k) => esc((DICT[Number(k)] || {}).s || "věta " + k), 5, (k) => "d|" + k) + "</div>";
  html += '<div class="card"><span class="label">Výslovnost</span>' +
    statRows(Object.entries(aggStats("pr|")), (k) => esc((PRON[Number(k)] || {}).s || "věta " + k), 5, (k) => "pr|" + k) + "</div>";
  html += '<div class="card"><span class="label">Text nahlas</span>' +
    statRows(Object.entries(aggStats("px|")), (k) => esc(pxLabel(k)), 5, (k) => "px|" + k) + "</div>";
  html += '<div class="card"><span class="label">Čtení (podle textu)</span>' +
    statRows(Object.entries(aggStats("t|")), (k) => esc((TEXTS[Number(k)] || {}).title || "text " + k), 5, (k) => "t|" + k) + "</div>";

  html += '<p class="statNote">Chytré opakování 🧠 z těchhle dat automaticky častěji vybírá to, kde jsou chyby. Tlačítkem „✓ umím“ položku vynuluješ — zmizí ze seznamu a přestane se protežovat. Když se chyby vrátí, objeví se tu zase.</p>';
  if (state.hidden.length) {
    const label = (id) => {
      const p = id.split("|");
      const i = Number(p[1]);
      if (p[0] === "t") return (TEXTS[i] || {}).title || id;
      if (p[0] === "s") return (SENTENCES[i] || {}).s || id;
      if (p[0] === "gr") return (GRAMMAR[i] || {}).s || id;
      if (p[0] === "d") return (DICT[i] || {}).s || id;
      if (p[0] === "sw") return (SWISS[i] || {}).ch || id;
      if (p[0] === "pa") return (PCAUX[i] || {}).s || id;
      if (p[0] === "pr") return (PRON[i] || {}).s || id;
      if (p[0] === "px") return pxLabel(p[1] + "|" + p[2]);
      return id;
    };
    html += '<div class="card"><div class="histHead"><span class="label">Vyřazené položky (' + state.hidden.length + ')</span>' +
      '<button class="histClear" data-action="unhide-all">obnovit vše</button></div>' +
      state.hidden.map((id) =>
        '<div class="statRow"><span class="statName">' + esc(label(id)) + "</span>" +
        '<span class="statVal"><button class="knowBtn" data-action="unhide-item" data-id="' + esc(id) + '">↩ obnovit</button></span></div>'
      ).join("") + "</div>";
  }
  html += '<button class="modeBtn" data-action="clear-stats">Smazat statistiky</button>';
  return html;
}

function exportData() {
  const payload = {
    app: "francouzstina", exported: new Date().toISOString(),
    history: state.history, stats: state.stats, days: state.days, hidden: state.hidden,
    settings: {
      level: state.level, tenseIds: state.tenseIds, grp: state.grp,
      sessionLen: state.sessionLen, ans: state.ans, smart: state.smart,
      sound: state.sound, goal: state.goal, vocabSrc: state.vocabSrc,
      numStyle: state.numStyle, houseHl: state.houseHl, vocabDir: state.vocabDir, gramTopics: state.gramTopics,
      vocabThemes: state.vocabThemes, speechRec: state.speechRec,
    },
  };
  const blob = new Blob([JSON.stringify(payload, null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "francouzstina-zaloha-" + todayKey() + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
}

function importData(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (d.app !== "francouzstina") throw new Error("cizí soubor");
      if (!confirm("Přepsat současný pokrok zálohou z " + (d.exported || "?").slice(0, 10) + "?")) return;
      state.history = d.history || [];
      state.stats = d.stats || {};
      state.days = d.days || {};
      state.hidden = d.hidden || [];
      saveJSON(HIDDEN_KEY, state.hidden);
      Object.assign(state, d.settings || {});
      saveJSON(HIST_KEY, state.history);
      saveJSON(STATS_KEY, state.stats);
      saveJSON(DAYS_KEY, state.days);
      saveSettings();
      render();
    } catch (e) {
      alert("Tohle nevypadá jako záloha téhle appky.");
    }
  };
  r.readAsText(file);
}

    '<div class="card helpCard"><span class="label">Režimy</span>' +
