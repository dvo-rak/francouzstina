    '<p><b>📅 K zopakování dnes</b> — appka plánuje opakování jako kartičky (Leitner): každá položka má krabičku 1–5; správná odpověď ji posune výš (opakuje se za 1 / 3 / 7 / 14 / 30 dní), chyba ji vrátí do krabičky 1. Tlačítko se objeví, jen když je dnes co opakovat, a ukáže počet.</p>' +
    '<p><b>🔁 Moje chyby</b> — rychlé kolo jen z položek, kde se v poslední době chybovalo.</p>' +
    '<p><b>Gramatika</b> — doplňování do vět podle témat tvé úrovně: členy, předložky, zápor, zájmena (COD/COI, y/en), srovnávání, vztažná zájmena, podmínky, subjonctif… Po odpovědi krátké vysvětlení. Ve volbách si vybereš jedno nebo víc témat (u každého je počet vět na tvé úrovni), nebo „Vše“. Výběr platí jen tady, v Mixu chodí všechna témata.</p>' +
    '<p><b>Stažené členy (articles contractés)</b> — téma Gramatiky (ve volbách vyber jen „Stažené členy“) na splývání předložek <i>à</i> a <i>de</i> s určitým členem: <i>à + le → au</i>, <i>à + les → aux</i>, <i>de + le → du</i>, <i>de + les → des</i>. Před ženským rodem a samohláskou se nestahuje (<i>à la gare</i>, <i>à l\'école</i>, <i>de l\'eau</i>). Obsahuje i vazby se slovesy (<i>jouer au foot</i> × <i>jouer du piano</i>, <i>avoir mal aux dents</i>), země (<i>au Portugal</i>, <i>aux États-Unis</i>) a na B1 rozlišení, kdy je <i>du</i> stažení a kdy dělivý člen.</p>' +
    '<p><b>Diktát (dictée)</b> — přehraje se celá věta francouzsky (klidně opakovaně), ty ji napíšeš. Vyhodnocení po slovech: zeleně správně, oranžově jen chybějící akcent, červeně chyba.</p>' +
    '<p><b>Časování</b> — sloveso, osoba a čas; vybereš (nebo napíšeš) správný tvar. Ve volbách si vybereš časy a skupinu sloves (všechna / nepravidelná / pravidelná — platí i pro slovesa ve slovíčkách).</p>' +
    '<p><b>Passé composé: être × avoir</b> — doplňuješ celý tvar do věty a vybíráš ze čtyř možností, které se liší právě pomocným slovesem a shodou (<i>est allée</i> × <i>a allé</i> × <i>est allé</i>…). V jednom kole se střídají slovesa z „domečku“ (🏠 pohyb a změna stavu → <i>être</i> + shoda s podmětem: <i>elle est allée</i>, <i>ils sont venus</i>) se slovesy mimo domeček (→ <i>avoir</i>, příčestí se nemění: <i>j\'ai fait le ménage</i>), takže je ten rozdíl vidět vedle sebe. Po odpovědi se ukáže, do které skupiny sloveso patří.</p>' +
    '<p>V tomhle cvičení je pod možnostmi tlačítko <b>🏠 domeček slovesa être</b> — rozbalí přímo pod otázkou schéma se všemi slovesy, která jdou s <i>être</i>. U každé nové otázky je zase sbalené, ať je to nápověda, po které sáhneš, když ji potřebuješ. Uvnitř si přepneš, jestli se má sloveso z právě řešené otázky zvýraznit, nebo jestli chceš vidět jen čistý domeček bez napovídání — tahle volba se pamatuje.</p>' +
    '<p><b>Passé composé × imparfait</b> — věta s mezerou, vybíráš mezi dvěma tvary. Po odpovědi se ukáže, <i>proč</i> je správně zrovna tenhle čas (signální slova jako <i>tous les étés</i>, <i>soudain</i>, <i>d\'habitude</i>…).</p>' +
    '<p><b>Slovíčka</b> — překlad oběma směry. Ve volbách si vybereš směr (FR → CZ, nebo CZ → FR) a zdroj: jen slovesa, jen tematická zásoba (jídlo, rodina, čas, barvy, cestování, počasí, oblečení, práce, pocity…), nebo obojí. Při „Jen témata“ si můžeš vybrat konkrétní témata, třeba jen počasí (<i>il fait beau, il y a du vent, il pleut…</i>); výběr platí jen tady, Mix bere všechno.</p>' +
    '<p><b>🎤 Věty nahlas</b> — přečti větu nahlas. Nejdřív si můžeš pustit 🔊 vzor, pak klepni na 🎤 číst a mluv; až dočteš, klepni na ⏹ hotovo (nebo chvíli počkej, ukončí se to samo). Telefon tvou řeč přepíše a appka obarví slova: zelená = zaznělo správně, červená = slyšel něco jiného. Za správně se počítá, jen když sedí všechna slova — věty jsou schválně postavené na zrádných dvojicích (<i>vu × vous</i>, <i>sur × sous</i>, <i>poisson × poison</i>, <i>ils‿ont × ils sont</i>) a pod větou je napsané, na co si dát pozor. Zároveň se nahráváš, takže si pak můžeš pustit vzor a sebe po sobě. Tlačítkem <b>🔁 zkusit znovu</b> čteš tu samou větu, kolikrát chceš; když to napodruhé sedí, počítá se to v kole jako správně (do statistik a plánu opakování jde jen první pokus, ať appka ví, co ti dělá potíže). Slova, která znějí stejně a liší se jen pravopisem (<i>a/à</i>, <i>parle/parlent</i>), se za chybu nepočítají. Je to kontrola <i>srozumitelnosti</i> (rozuměl by ti Francouz?), ne fonetická analýza každé hlásky. Když rozpoznávání nefunguje nebo ho v Nastavení vypneš, zůstane jen nahrávání: nahraješ se, poslechneš a sama ohodnotíš.</p>' +
    '<p><b>🎤 Text nahlas</b> — totéž, ale delší úryvek (2–3 věty) z textů na čtení, často s čísly: otvírací doby (<i>de 10 h à 19 h</i>), ceny (<i>2,50 euros</i>), data (<i>le 1er octobre</i>), telefonní čísla. Čísla čti celá, jak se říkají; je jedno, jestli je telefon pak napíše číslicemi, nebo slovy. Tady stačí 90 % slov (u dlouhého textu občas něco přeslechne i telefon) a jména (šedě) se nehodnotí, protože je telefon píše po svém.</p>' +
    '<p><b>Porozumění textu (DELF)</b> — krátký text (e-mail, inzerát, článek…) a otázky francouzsky, jako u zkoušky. Text zůstává během otázek nahoře. Nabízejí se texty do tvé úrovně včetně (na B2 tedy i A1–B1 — nižší úroveň textu neuškodí).</p>' +
    '<p><b>Čísla 0–100</b> — číslo vybereš/napíšeš francouzsky. Se zapnutým zvukem je půlka otázek poslechová: slyšíš číslo a píšeš číslice.</p>' +
    '<p><b>🕐 Hodiny</b> — kolik je hodin francouzsky. Pozor na hlavní past: čeština počítá k <i>další</i> hodině, francouzština od <i>předchozí</i>. <b>Půl čtvrté</b> (15:30) je <i>trois heures et demie</i>, ne <i>quatre</i>! Podobně <b>čtvrt na čtyři</b> = <i>trois heures et quart</i> (3:15) a <b>tři čtvrtě na čtyři</b> = <i>quatre heures moins le quart</i> (3:45 — tady je zase čtyřka, „čtyři bez čtvrt“). Minuty po celé se přidávají (<i>trois heures dix</i>), po půl se odečítají od další hodiny (<i>quatre heures moins dix</i> = 3:50). Ve 12 je <i>midi</i>, ve 24 <i>minuit</i> (a <i>midi et demi</i> bez e). Ráno/odpoledne/večer se rozliší <i>du matin / de l\'après-midi / du soir</i>; úředně (nádraží, rádio) se říká 24h: <i>quinze heures trente</i>. Otázky chodí trojím způsobem: česky hovorově → francouzsky, z digitálního času (15:30) → francouzsky a francouzsky (i poslechem) → digitální čas. Při psaní času stačí 15:30 nebo 15h30.</p>' +
    '<p><b>Rody: un / une</b> — tipuješ rod podstatného jména. Vybraná jsou hlavně zrádná slova (<i>le problème, le musée, l\'eau — f!, le bonheur…</i>).</p>' +
    '<p><b>🇨🇭 Švýcarská francouzština</b> — rozdíly mezi francouzskou a švýcarskou (romandskou) francouzštinou: slovíčka (<i>natel</i>, <i>cornet</i>, <i>panosse</i>, <i>bancomat</i>), úřední a školní pojmy (<i>votation</i>, <i>maturité</i>, <i>action</i> = sleva), výrazy (<i>ça joue</i>, <i>tout de bon</i>) a hlavně <b>zrádné názvy jídel</b>: švýcarský <i>déjeuner</i> je snídaně, <i>dîner</i> je oběd a <i>souper</i> večeře — o jedno posunuté oproti Francii. Otázky chodí oběma směry a u záludností je česká poznámka.</p>' +
    '</div>' +

    '<div class="card helpCard"><span class="label">⚙️ Nastavení</span>' +
    '<p><b>Otázek v kole</b> — délka jednoho kola; u ∞ cvičíš, dokud nedáš „← ukončit“. U čtení je kolo vždy jeden text s otázkami.</p>' +
    '<p><b>Čísla 70–99</b> — přepínač stylu: francouzsky (<i>soixante-dix, quatre-vingts, quatre-vingt-dix</i>) nebo švýcarsky (<i>septante, huitante, nonante</i>). Pozn.: <i>septante</i> a <i>nonante</i> se používají v celé Romandii včetně Ženevy, ale <i>huitante</i> jen ve Vaud, Valais a Fribourgu — v Ženevě se pro 80 říká <i>quatre-vingts</i>. Při psaní se proto uznají obě varianty.</p>' +
    '<p><b>Denní cíl a série 🔥</b> — kolik otázek denně chceš stihnout. Nahoře v menu vidíš dnešní počet, sérii dní se splněným cílem a mřížku posledních 28 dní (modrá = něco, zelená = cíl splněn).</p>' +
    '<p><b>✍ psaní odpovědí</b> — místo výběru ze 4 možností odpověď píšeš. Těžší, ale blíž zkoušce. Kontrola je tolerantní: chybějící háčky a čárky (<i>etais</i> místo <i>étais</i>) se počítají jako správně, jen s upozorněním „pozor na akcenty“; u čísel je jedno, jestli píšeš pomlčky, nebo mezery. U časování stačí napsat samotný tvar (<i>ai répondu</i>), ale uzná se i celý tvar se zájmenem (<i>j\'ai répondu</i>).</p>' +
    '<p><b>🧠 chytré opakování</b> — appka si (jen v tomhle prohlížeči) počítá, kde děláš chyby, a tyhle věci ti pak nabízí <b>častěji</b>. Nic víc v tom není — žádné plánování na dny dopředu, prostě „co ti nejde, chodí častěji“. Vypnuté = čistě náhodný výběr.</p>' +
    '<p><b>🔊 zvuk</b> — francouzské předčítání hlasem prohlížeče: slovíčka, čísla (i poslechové otázky), po odpovědi věty a <i>un/une + slovo</i>, u textů tlačítko „přečíst“. Po každé odpovědi je navíc tlačítko <b>🔊 přehrát</b>, které správnou odpověď přečte francouzsky (u vět celou větu s doplněnou odpovědí, u překladu do češtiny francouzské slovo) — funguje i s vypnutým automatickým zvukem. Pokud slyšíš angličtinu, chybí v zařízení francouzský hlas — na iPhonu: Nastavení → Zpřístupnění → Předčítání obsahu → Hlasy → Francouzština; na Androidu: nastavení Google TTS; na Windows: Nastavení → Čas a jazyk → Řeč → Přidat hlasy → Français, a pak restartovat prohlížeč.</p>' +
    '</div>' +

    '<div class="card helpCard"><span class="label">📊 Statistiky a „✓ umím“</span>' +
    '<p>Statistiky ukazují, co ti jde nejhůř — nejtěžší slovesa, časy, slovíčka, čísla, rody, věty i texty. Přesně z nich čerpá chytré opakování.</p>' +
    '<p>Tlačítko <b>„✓ umím“</b> vynuluje počítadlo dané položky: zmizí ze seznamu a přestane se ti podsouvat častěji. Není to napořád — když v ní zase uděláš chybu, objeví se tu znovu.</p>' +
    '<p><b>🚫 už nedávat</b> — když nějaký text, větu, gramatickou položku nebo diktát znáš už nazpaměť, vyřaď ji z rotace úplně: u textů tlačítkem na výsledkové obrazovce, u ostatních odkazem pod odpovědí. Vyřazené položky se přestanou losovat i plánovat k opakování; seznam s možností obnovení je ve Statistikách.</p>' +
    '</div>' +

    '<div class="card helpCard"><span class="label">Soukromí a data</span>' +
    '<p>Všechno (historie, statistiky, pokrok, nastavení) se ukládá jen v prohlížeči — appka sama nikam nic neposílá, žádný účet. Jediná výjimka je rozpoznávání řeči ve cvičeních 🎤 Věty / Text nahlas: přepis řeči dělá prohlížeč a zvuk přitom zpracovává jeho výrobce (Apple u Safari, Google u Chromu). Tvoje nahrávka zůstává jen v telefonu a po přechodu na další větu se zahodí. Rozpoznávání jde v Nastavení vypnout. Data jsou tedy vázaná na konkrétní zařízení; v Nastavení je ale tlačítko na stažení zálohy a její obnovení jinde (telefon ↔ počítač).</p>' +
    '</div>';
}

function render() {
  if (state.screen === "menu") app.innerHTML = renderMenu();
  else if (state.screen === "quiz") app.innerHTML = renderQuiz();
  else if (state.screen === "stats") app.innerHTML = renderStats();
  else if (state.screen === "help") app.innerHTML = renderHelp();
  else if (state.screen === "settings") app.innerHTML = renderSettings();
  else app.innerHTML = renderDone();
  const inp = document.getElementById("typeInput");
  if (inp) inp.focus();
}

app.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.dataset.action;
  const id = btn.dataset.id;
  if (action === "grp") { state.grp = id; saveSettings(); render(); }
  else if (action === "tense") toggleTense(id);
  else if (action === "len") { state.sessionLen = Number(id); saveSettings(); render(); }
  else if (action === "goal") { state.goal = Number(id); saveSettings(); render(); }
  else if (action === "vocab-src") { state.vocabSrc = id; saveSettings(); render(); }
  else if (action === "num-style") { state.numStyle = id; saveSettings(); render(); }
  else if (action === "level") {
    state.level = id;
    state.tenseIds = tensePreset(id);
    state.sheet = null;
    saveSettings(); render();
  }
  else if (action === "sheet") { state.sheet = id; render(); }
  else if (action === "close-sheet") { state.sheet = null; render(); }
  else if (action === "vocab-dir") { state.vocabDir = id; saveSettings(); render(); }
  else if (action === "gram-topic") {
    if (id === "*") state.gramTopics = [];
    else if (state.gramTopics.includes(id)) state.gramTopics = state.gramTopics.filter((t) => t !== id);
    else state.gramTopics = [...state.gramTopics, id];
    saveSettings(); render();
  }
  else if (action === "vocab-theme") {
    if (id === "*") state.vocabThemes = [];
    else if (state.vocabThemes.includes(id)) state.vocabThemes = state.vocabThemes.filter((t) => t !== id);
    else state.vocabThemes = [...state.vocabThemes, id];
    saveSettings(); render();
  }
  else if (action === "ans") { state.ans = id; saveSettings(); render(); }
  else if (action === "set-smart" || action === "set-sound" || action === "set-speechRec") {
    state[action.slice(4)] = id === "1";
    saveSettings(); render();
  }
  else if (action === "read-text") speak(TEXTS[state.cteIdx].text);
  else if (action === "start") start(id);
  else if (action === "answer") answerChoice(state.q.options[Number(id)]);
  else if (action === "submit-typed") answerTyped(document.getElementById("typeInput").value);
  else if (action === "replay") speak(state.q.audio);
  else if (action === "say-answer") speak(state.q.say);
  else if (action === "pron-start") pronStart();
  else if (action === "pron-stop") { if (prRec) prRec.stop(); }
  else if (action === "pron-rec") pronRecStart();
  else if (action === "pron-rec-stop") prRecordStop();
  else if (action === "pron-self") {
    if (state.picked !== null || !state.pr) return;
    state.pr.self = true;
    state.pr.ok = id === "ok";
    pronAnswer(state.pr.ok, id === "ok" ? "✓" : "✗");
  }
  else if (action === "pron-retry") pronRetry();
  else if (action === "next") next();
  else if (action === "finish") finish();
  else if (action === "encore") start(state.mode);
  else if (action === "menu") { pronReset(); state.screen = "menu"; state.sheet = null; render(); }
  else if (action === "show-settings") { state.screen = "settings"; render(); }
  else if (action === "show-stats") { state.screen = "stats"; render(); }
  else if (action === "show-help") { state.screen = "help"; render(); }
  else if (action === "toggle-house") { state.houseOpen = !state.houseOpen; render(); }
  else if (action === "house-hl") { state.houseHl = id === "on"; saveSettings(); render(); }
  else if (action === "clear-history") {
    state.history = [];
    try { localStorage.removeItem(HIST_KEY); } catch {}
    render();
  }
  else if (action === "hide-item") {
    setHidden(id, true);
    if (state.screen === "quiz") next(); else render();
  }
  else if (action === "unhide-item") { setHidden(id, false); render(); }
  else if (action === "unhide-all") {
    state.hidden = [];
    saveJSON(HIDDEN_KEY, state.hidden);
    render();
  }
  else if (action === "export-data") exportData();
  else if (action === "import-data") document.getElementById("importFile").click();
  else if (action === "mark-known") {
    const spec = id;
    for (const key of Object.keys(state.stats)) {
      if (key === spec || (spec.endsWith("|") && key.startsWith(spec))) delete state.stats[key];
    }
    saveJSON(STATS_KEY, state.stats);
    render();
  }
  else if (action === "clear-stats") {
    state.stats = {};
    try { localStorage.removeItem(STATS_KEY); } catch {}
    render();
  }
});

app.addEventListener("change", (e) => {
  if (e.target.id === "importFile" && e.target.files && e.target.files[0]) {
    importData(e.target.files[0]);
    e.target.value = "";
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && state.sheet) { state.sheet = null; render(); return; }
  if (e.key === "Enter" && e.target.id === "typeInput") {
    answerTyped(e.target.value);
  }
});

render();
</script>
</body>
</html>
